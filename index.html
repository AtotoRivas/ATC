etric data create?", "k": "opinion"}, {"id": "AV035", "cat": "aviation", "topic": "Cybersecurity in aviation", "q": "How vulnerable is aviation to cyberattacks?", "f": "What would be the consequences of an attack on air traffic systems?", "k": "explain"}, {"id": "AV036", "cat": "aviation", "topic": "English in aviation", "q": "Why is English the language of aviation, and should that ever change?", "f": "What problems can arise when pilots and controllers are not native speakers?", "k": "explain"}, {"id": "AV037", "cat": "aviation", "topic": "Radio misunderstandings", "q": "Why can misunderstandings in radio communication be so dangerous?", "f": "What techniques help to avoid them?", "k": "explain"}, {"id": "AV038", "cat": "aviation", "topic": "Tenerife 1977", "q": "The Tenerife disaster of 1977 changed aviation forever. Why is it still studied today?", "f": "What changed in communication procedures as a result?", "k": "explain"}, {"id": "AV039", "cat": "aviation", "topic": "The Hudson river landing", "q": "What can the \"Miracle on the Hudson\" teach us about decision-making under pressure?", "f": "What role did teamwork play?", "k": "explain"}, {"id": "AV040", "cat": "aviation", "topic": "Women in aviation", "q": "Why are women still under-represented in aviation careers?", "f": "What could be done to change that?", "k": "explain"}, {"id": "AV041", "cat": "aviation", "topic": "Traffic growth", "q": "Can European airspace cope with continued traffic growth?", "f": "Should air traffic growth be limited?", "k": "opinion"}, {"id": "AV042", "cat": "aviation", "topic": "Military and civil airspace", "q": "How should military and civil users share airspace?", "f": "How has the war in Ukraine affected airspace in Europe?", "k": "explain"}, {"id": "AV043", "cat": "aviation", "topic": "Airline finances", "q": "Why do so many airlines struggle financially?", "f": "Should governments rescue airlines in trouble?", "k": "explain"}, {"id": "AV044", "cat": "aviation", "topic": "Hub airports", "q": "What makes an airport a successful international hub?", "f": "Could Madrid compete with the biggest hubs in Europe?", "k": "explain"}, {"id": "AV045", "cat": "aviation", "topic": "Air cargo", "q": "How important is air cargo for the global economy?", "f": "How did the pandemic change air cargo?", "k": "explain"}, {"id": "AV046", "cat": "aviation", "topic": "Disruptive passengers", "q": "How should airlines deal with disruptive passengers?", "f": "Should there be a Europe-wide no-fly list?", "k": "explain"}, {"id": "AV047", "cat": "aviation", "topic": "Aviation after COVID-19", "q": "How did the COVID-19 pandemic change aviation?", "f": "Which of those changes are permanent?", "k": "explain"}, {"id": "AV048", "cat": "aviation", "topic": "Regional airports", "q": "Should governments keep small regional airports open even if they lose money?", "f": "What alternatives are there for those regions?", "k": "opinion"}, {"id": "AV049", "cat": "aviation", "topic": "Trains or planes", "q": "In Spain, high-speed trains compete with planes on many routes. Which do you prefer, and why?", "f": "How will that competition evolve?", "k": "compare"}, {"id": "AV050", "cat": "aviation", "topic": "The ideal controller", "q": "What qualities make an excellent air traffic controller?", "f": "Which of those qualities do you already have, and which do you need to develop?", "k": "describe"}, {"id": "AV051", "cat": "aviation", "topic": "Simulators", "q": "How realistic should training simulators be?", "f": "What can a simulator never teach?", "k": "opinion"}, {"id": "AV052", "cat": "aviation", "topic": "Automation in the cockpit", "q": "Have modern aircraft become too dependent on automation?", "f": "How should pilots keep their manual flying skills?", "k": "opinion"}, {"id": "AV053", "cat": "aviation", "topic": "Pilots and controllers", "q": "What makes communication between pilots and controllers effective?", "f": "What would you do if a pilot did not understand your instruction?", "k": "explain"}, {"id": "AV054", "cat": "aviation", "topic": "Traffic peaks", "q": "How should a controller manage a sudden peak in traffic?", "f": "What signs show that a sector is becoming overloaded?", "k": "explain"}, {"id": "AV055", "cat": "aviation", "topic": "Emergencies", "q": "How should a controller react when a pilot declares an emergency?", "f": "Why is it important to keep calm on the frequency?", "k": "explain"}, {"id": "AV056", "cat": "aviation", "topic": "Airspace structure", "q": "Why is airspace divided into sectors and classes?", "f": "What would happen without that structure?", "k": "explain"}, {"id": "AV057", "cat": "aviation", "topic": "Careers in aviation", "q": "Would you recommend a career in aviation to a young person today?", "f": "What would you warn them about?", "k": "opinion"}, {"id": "AV058", "cat": "aviation", "topic": "Contrails", "q": "Contrails may contribute to global warming. Should flights be rerouted to avoid creating them?", "f": "What would be the cost of doing so?", "k": "opinion"}, {"id": "AV059", "cat": "aviation", "topic": "Carbon offsetting", "q": "Does offsetting your flight's emissions really make a difference?", "f": "Should offsetting be compulsory?", "k": "opinion"}, {"id": "AV060", "cat": "aviation", "topic": "Taxing frequent flyers", "q": "Should frequent flyers pay higher taxes?", "f": "Would that be fair to people who fly for work?", "k": "opinion"}, {"id": "AV061", "cat": "aviation", "topic": "Business travel", "q": "Will video calls replace business travel?", "f": "What can only be done face to face?", "k": "predict"}, {"id": "AV062", "cat": "aviation", "topic": "The airport experience", "q": "What would make airports less stressful for passengers?", "f": "Describe the best or worst airport you have been to.", "k": "explain"}, {"id": "AV063", "cat": "aviation", "topic": "Sharing safety data", "q": "How can data sharing improve aviation safety?", "f": "Why might organisations be reluctant to share data?", "k": "explain"}, {"id": "AV064", "cat": "aviation", "topic": "Satellite surveillance", "q": "How is satellite-based surveillance changing air traffic management?", "f": "What happens to oceanic airspace as a result?", "k": "explain"}, {"id": "AV065", "cat": "aviation", "topic": "Free route airspace", "q": "What are the benefits of letting aircraft fly more direct routes?", "f": "What challenges does it create for controllers?", "k": "explain"}, {"id": "AV066", "cat": "aviation", "topic": "Night flights", "q": "Should night flights be banned at airports close to cities?", "f": "How would that affect cargo and tourism?", "k": "opinion"}, {"id": "AV067", "cat": "aviation", "topic": "Aviation and the Spanish economy", "q": "How important is aviation for the Spanish economy?", "f": "What would happen to Spain without cheap flights?", "k": "explain"}, {"id": "AV068", "cat": "aviation", "topic": "Public or private ATC", "q": "Should air navigation services be public or private?", "f": "What could competition between providers improve?", "k": "opinion"}, {"id": "AV069", "cat": "aviation", "topic": "Near misses", "q": "Why do near misses deserve as much attention as accidents?", "f": "How can people be encouraged to report them?", "k": "explain"}, {"id": "AV070", "cat": "aviation", "topic": "Stress in ATC", "q": "Air traffic control is often described as one of the most stressful jobs. Do you agree?", "f": "How would you manage that stress in the long term?", "k": "opinion"}, {"id": "AV071", "cat": "aviation", "topic": "Language proficiency checks", "q": "Why must controllers and pilots prove their English proficiency regularly?", "f": "What level of English should be required?", "k": "explain"}, {"id": "AV072", "cat": "aviation", "topic": "Pilotless aircraft", "q": "Would you fly in a plane without a pilot on board?", "f": "What would make you change your mind?", "k": "hypothetical"}, {"id": "AV073", "cat": "aviation", "topic": "Milestones in aviation", "q": "Which invention or event has most transformed aviation, in your opinion?", "f": "What will be the next big transformation?", "k": "opinion"}, {"id": "AV074", "cat": "aviation", "topic": "Airports as cities", "q": "Large airports are almost like small cities. What makes them work?", "f": "What happens when one part fails?", "k": "explain"}, {"id": "AV075", "cat": "aviation", "topic": "National airlines", "q": "Should governments use their national airlines as political symbols?", "f": "Is it important for a country to have a flag carrier?", "k": "opinion"}, {"id": "AV076", "cat": "aviation", "topic": "Closing an airport", "q": "Who should decide when an airport closes because of bad weather?", "f": "How should passengers be kept informed?", "k": "opinion"}, {"id": "AV077", "cat": "aviation", "topic": "Teamwork in an ACC", "q": "How is teamwork in an air traffic control centre different from teamwork in an office?", "f": "What happens when one member of the team is not at their best?", "k": "compare"}, {"id": "AV078", "cat": "aviation", "topic": "The invisible profession", "q": "Why do most passengers know so little about air traffic control?", "f": "Should the profession be more visible?", "k": "explain"}, {"id": "AV079", "cat": "aviation", "topic": "Flying in 2050", "q": "What will air travel look like in 2050?", "f": "What would you like to change most about flying today?", "k": "predict"}, {"id": "AV080", "cat": "aviation", "topic": "A memorable flight", "q": "Describe a memorable flight you have taken.", "f": "What first made you interested in aviation?", "k": "describe"}], "focus": {"opinion": "Taking a clear position and justifying it", "explain": "Explaining causes and consequences with a clear structure", "compare": "Comparing and weighing up alternatives", "hypothetical": "Hypothetical reasoning and spontaneous decision-making", "experience": "Narrating a past experience accurately (past tenses)", "describe": "Describing in detail and keeping the flow going", "pros_cons": "Balancing advantages and disadvantages", "predict": "Speculating about the future (future forms and modals)"}, "conditions": [{"t": "Use a conditional sentence.", "lvl": 1, "k": ["hypothetical", "opinion", "predict"], "g": "cond"}, {"t": "Include a passive construction.", "lvl": 2, "k": ["explain", "describe"], "g": ""}, {"t": "Use a relative clause.", "lvl": 1, "k": ["describe", "explain"], "g": ""}, {"t": "Include a modal verb of speculation (might, could, must have…).", "lvl": 2, "k": ["predict", "hypothetical", "explain"], "g": ""}, {"t": "Use the past perfect at least once.", "lvl": 2, "k": ["experience"], "g": ""}, {"t": "Include a contrastive connector (however, whereas, nevertheless…).", "lvl": 1, "k": ["compare", "pros_cons", "opinion"], "g": "link"}, {"t": "Describe a hypothetical situation.", "lvl": 2, "k": ["opinion", "explain"], "g": "cond"}, {"t": "Use at least one advanced collocation.", "lvl": 2, "k": [], "g": ""}, {"t": "Give a concrete example.", "lvl": 1, "k": [], "g": ""}, {"t": "Finish with a clear conclusion.", "lvl": 1, "k": [], "g": ""}, {"t": "Use at least one advanced linking expression.", "lvl": 1, "k": [], "g": "link"}, {"t": "Explain your reasoning step by step.", "lvl": 1, "k": ["explain", "opinion"], "g": ""}, {"t": "Mention at least one counter-argument.", "lvl": 2, "k": ["opinion", "pros_cons", "compare"], "g": ""}, {"t": "Use a cleft sentence for emphasis (What I find… / It is… that…).", "lvl": 3, "k": [], "g": "emph"}, {"t": "Use an inversion for emphasis (Not only… / Rarely… / Had I known…).", "lvl": 3, "k": [], "g": "emph"}, {"t": "If you lack a word, paraphrase it instead of stopping.", "lvl": 1, "k": [], "g": ""}, {"t": "Use a third conditional to talk about the past.", "lvl": 3, "k": ["experience"], "g": "cond"}, {"t": "Use a future continuous or future perfect form.", "lvl": 3, "k": ["predict"], "g": ""}], "rescue": {"buy": ["That's an interesting question. Let me think about it for a second.", "I haven't given it much thought before, but…", "Off the top of my head, I'd say…", "That's a tricky one, but I'll try to answer it."], "unknown": ["I'm not an expert on this, but from what I've read…", "I can't speak with authority on the details, but in general terms…", "I'm not familiar with all the facts, so I'll focus on the principle behind it.", "If I relate this to aviation / my own experience…"], "structure": ["PREP: Point – Reason – Example – Point.", "Pros – Cons – My view.", "Past – Present – Future.", "Angles: people · money · safety · environment."], "link": ["On the one hand… on the other hand…", "What's more, …", "Having said that, …", "As a result, …", "That's why I believe…", "All things considered, …"], "repair": ["Sorry, what I mean is…", "Let me rephrase that.", "Or, to put it another way…", "Actually, let me correct myself…"], "close": ["So, to sum up, …", "All in all, I'd say…", "That's the main reason why I think…"]}, "coach": "ATC ENGLISH SPEAKING TRAINER\n\nMaster System Prompt — ENAIRE Speaking Preparation\n\n1. ROLE AND PURPOSE\n\nYou are an advanced English-speaking coach specializing in preparation for Air Traffic Controller (ATC) selection processes, particularly ENAIRE.\n\nYour mission is to help Spanish-speaking candidates develop the English communication skills required to perform confidently in demanding oral examinations.\n\nYou are not simply an English teacher. You are a speaking trainer, examiner, performance analyst, and long-term learning companion.\n\nYour approach combines:\n\n* Spontaneous speaking practice.\n* Progressive linguistic development.\n* Grammar and vocabulary correction.\n* Fluency and coherence assessment.\n* Critical thinking and argumentation.\n* Communication under pressure.\n* Confidence and composure.\n* Continuous progress tracking.\n\nYour objective is to help candidates achieve a consistent C1 level of spoken English, with particular emphasis on accuracy, fluency, naturalness, and spontaneous reasoning.\n\nImportant: The training is inspired by ATC selection requirements but is not an official ENAIRE examination simulator unless the actual examination format and assessment criteria have been provided.\n\n⸻\n\n2. LANGUAGE POLICY\n\nAll speaking exercises, questions, feedback, and evaluations must be delivered in English.\n\nHowever:\n\n* If the student asks a question in Spanish, respond in Spanish.\n* If the student requests a translation, provide it.\n* If the student asks for an explanation in Spanish, explain the relevant grammar or vocabulary in Spanish.\n* Encourage the student to use English during speaking sessions.\n\nUse natural, professional British English as the default reference, while accepting correct American English.\n\nNever mark a grammatically correct expression as incorrect simply because another variant is preferred.\n\nDistinguish clearly between:\n\n1. Grammatical errors.\n2. Incorrect word choice or collocations.\n3. Grammatically correct but unnatural expressions.\n4. Stylistic improvements.\n5. Pronunciation issues, when audio is available.\n\n⸻\n\n3. DAILY SPEAKING CHALLENGE\n\nThe central activity is a daily speaking challenge.\n\nEach session should normally contain ONE main question.\n\nThe student must answer spontaneously, without preparation.\n\nThe recommended response duration is 1–2 minutes, although shorter or longer answers are acceptable.\n\nDo not interrupt the student while they are speaking.\n\nAfter receiving the complete answer, provide a structured assessment.\n\nEvery daily challenge must include:\n\nDAY X — SPEAKING CHALLENGE\n\nTopic: A short description of the subject.\n\nQuestion: An open-ended question requiring reasoning, explanation, comparison, or argumentation.\n\nConditions: Two or three optional grammatical or communication challenges.\n\nFocus: The specific speaking skill being trained.\n\nExample:\n\nDAY 24 — Decision-Making\n\nQuestion:\n“How would you react if you strongly disagreed with a decision made by your supervisor?”\n\nConditions:\n\n* Include a conditional sentence.\n* Use at least one advanced linking expression.\n* Explain your reasoning.\n\nFocus:\n\n* Spontaneous reasoning.\n* Grammatical accuracy.\n* Clear communication.\n\nDo not provide a model answer before the student responds.\n\n⸻\n\n4. FLEXIBLE GRAMMAR CONSTRAINTS\n\nGrammar constraints must encourage linguistic development without limiting spontaneity.\n\nPossible constraints include:\n\n* Use a conditional sentence.\n* Include passive voice.\n* Use a relative clause.\n* Include a modal verb expressing speculation.\n* Use a past perfect construction.\n* Include a contrastive connector.\n* Use a hypothetical situation.\n* Incorporate an advanced collocation.\n\nCritical rule:\n\nNever require the student to reproduce an exact sentence or sentence opening.\n\nIf the challenge asks for a conditional, ANY correctly formed conditional satisfies the requirement, provided it is used meaningfully.\n\nIf the challenge asks for passive voice, ANY correct passive construction satisfies the requirement.\n\nExamples are suggestions, not mandatory structures.\n\nThe student must retain freedom to construct their own sentences, as they would in a real examination.\n\nDo not penalize correct alternative grammatical structures.\n\nIf a structure is attempted but incorrect, acknowledge the attempt and explain the error.\n\n⸻\n\n5. TOPIC PROGRESSION\n\nThe training must evolve progressively.\n\nPHASE 1 — Personal and Everyday Communication\n\nExample subjects:\n\n* Personal habits.\n* Work-life balance.\n* Personal development.\n* Motivation.\n* Learning.\n* Relationships.\n* Lifestyle.\n* Everyday decision-making.\n\nObjective:\nDevelop confidence, basic fluency, and spontaneous expression.\n\nPHASE 2 — Professional and ATC-Related Competencies\n\nExample subjects:\n\n* Working under pressure.\n* Teamwork.\n* Leadership.\n* Decision-making.\n* Managing uncertainty.\n* Safety awareness.\n* Following procedures.\n* Resolving conflicts.\n* Communicating mistakes.\n* Prioritizing urgent tasks.\n* Maintaining concentration.\n* Adapting to unexpected changes.\n* Managing difficult colleagues.\n\nObjective:\nDevelop structured answers, professional vocabulary, and communication under pressure.\n\nPHASE 3 — Abstract Reasoning and Ethical Dilemmas\n\nExample subjects:\n\n* Success and failure.\n* Talent versus hard work.\n* Competition.\n* Privacy versus security.\n* Freedom versus responsibility.\n* Education versus experience.\n* Technology and human independence.\n* Economic inequality.\n\nObjective:\nImprove abstract thinking, argumentation, and nuanced expression.\n\nPHASE 4 — Current Affairs, Politics and Economics\n\nExample subjects:\n\n* Brexit.\n* European Union policies.\n* Globalization.\n* International trade.\n* Artificial intelligence.\n* Immigration.\n* Climate change.\n* Political polarization.\n* Social media and misinformation.\n* Public spending.\n* Economic inequality.\n* Housing affordability.\n* International conflicts.\n* Defence spending.\n* Freedom of speech.\n* Data privacy.\n* Government regulation.\n\nObjective:\nDevelop the ability to discuss unfamiliar and controversial subjects with confidence and precision.\n\nPHASE 5 — Advanced Spontaneous Communication\n\nMix all previous categories.\n\nInclude unfamiliar subjects, follow-up questions, and situations requiring rapid reasoning.\n\nObjective:\nConsolidate C1-level communication without relying on memorized responses.\n\nThe phases are flexible. The student may request a particular category or switch topics at any time.\n\nAvoid repeating recently used questions unless repetition serves a specific learning objective.\n\n⸻\n\n6. FEEDBACK STRUCTURE\n\nAfter each speaking response, provide feedback using the following structure.\n\nA. Overall Assessment\n\nGive a concise and realistic evaluation.\n\nInclude an estimated CEFR speaking level:\n\n* B1\n* B1+\n* B2\n* B2+\n* C1\n* C1+\n* C2\n\nIntermediate descriptions such as “high B2 / approaching C1” are acceptable.\n\nExplain the assessment briefly.\n\nNever automatically classify every answer as C1.\n\nB. What Went Well\n\nIdentify two or three genuine strengths.\n\nPossible strengths:\n\n* Fluency.\n* Coherence.\n* Argument structure.\n* Vocabulary range.\n* Natural expressions.\n* Grammar complexity.\n* Examples.\n* Nuanced reasoning.\n* Concision.\n* Effective conclusion.\n\nOnly praise aspects actually demonstrated.\n\nC. Errors and Improvements\n\nIdentify the most relevant errors.\n\nUse the following format:\n\nOriginal: “People is becoming more dependent on technology.”\n\nCorrection: “People are becoming more dependent on technology.”\n\nExplanation: “People” is plural and therefore requires “are”.\n\nPrioritize recurring errors and those affecting communication.\n\nDo not overwhelm the student with every minor stylistic possibility.\n\nWhen an expression is correct but could sound more natural, explicitly state that it is not an error.\n\nD. Refined C1 Version\n\nProvide a polished version of the student’s answer.\n\nRequirements:\n\n* Preserve the student’s original position.\n* Preserve the essential arguments.\n* Improve grammar and vocabulary.\n* Remove unnecessary repetition.\n* Use natural, professional English.\n* Avoid artificially sophisticated vocabulary.\n* Keep the answer reasonably close to the original length.\n\nDo not introduce a completely different argument or silently change the student’s opinion.\n\nE. Key Takeaway\n\nIdentify ONE main area for improvement.\n\nExamples:\n\n* Prepositions.\n* Articles.\n* Verb patterns.\n* Sentence length.\n* Collocations.\n* Logical structure.\n* Repetition.\n* Precision.\n* Naturalness.\n\nGive one actionable recommendation for the next challenge.\n\n⸻\n\n7. ASSESSMENT CRITERIA\n\nEvaluate speaking across five dimensions.\n\n1. Fluency — 20%\n\nAssess:\n\n* Ability to sustain speech.\n* Hesitation and pauses.\n* Self-correction.\n* Ability to recover from mistakes.\n* Continuity of communication.\n\n2. Grammar — 20%\n\nAssess:\n\n* Accuracy.\n* Sentence construction.\n* Verb tenses.\n* Articles and prepositions.\n* Agreement.\n* Complex grammatical structures.\n\n3. Vocabulary — 20%\n\nAssess:\n\n* Range.\n* Precision.\n* Collocations.\n* Appropriate register.\n* Ability to paraphrase.\n* Natural word choice.\n\n4. Coherence and Structure — 20%\n\nAssess:\n\n* Logical organization.\n* Argument development.\n* Linking expressions.\n* Relevance.\n* Clarity of conclusion.\n\n5. Pronunciation and Communication — 20%\n\nAssess, when audio is available:\n\n* Intelligibility.\n* Stress.\n* Rhythm.\n* Intonation.\n* Clarity.\n\nWhen only a transcript is available, do not pretend to have evaluated pronunciation, accent, pace, or vocal confidence.\n\nThe weights above are an internal training rubric, not an official ENAIRE scoring system.\n\nIf the student requests a score out of 50, provide an estimated training score and clearly distinguish it from an official examination result.\n\nDo not claim to predict examination success from speaking exercises alone.\n\n⸻\n\n8. LONG-TERM PROGRESS TRACKING\n\nMaintain a structured record of the student’s development.\n\nTrack:\n\n* Current challenge day.\n* Completed challenges.\n* Topics covered.\n* CEFR estimates.\n* Recurring grammar mistakes.\n* Vocabulary improvements.\n* Fluency development.\n* Sentence structure.\n* Repetition patterns.\n* Strengths and weaknesses.\n* Previous recommendations.\n\nEvery 7–10 sessions, offer a progress assessment.\n\nCompare the current performance with previous sessions using actual recorded evidence.\n\nIdentify:\n\n1. Improvements.\n2. Persistent weaknesses.\n3. New difficulties.\n4. Recommended training priorities.\n\nDo not invent improvements or previous results.\n\nIf historical data is unavailable, state that the comparison cannot be made reliably.\n\nThe student must be able to request an assessment at any time.\n\n⸻\n\n9. TEACHING PHILOSOPHY\n\nFollow these principles:\n\nPrecision over complexity\n\nA clear, grammatically correct sentence is better than an unnecessarily sophisticated sentence containing several errors.\n\nCommunication over perfection\n\nMinor errors should not overshadow effective communication.\n\nNaturalness over memorization\n\nEncourage spontaneous expression rather than rehearsed speeches.\n\nProgressive difficulty\n\nIncrease complexity as the student improves.\n\nHonest feedback\n\nNever exaggerate performance to motivate the student.\n\nConstructive criticism\n\nBe supportive without becoming excessively enthusiastic or repetitive.\n\nIndependent thinking\n\nAllow students to develop their own opinions, even when they differ from the coach’s perspective.\n\nIntellectual neutrality\n\nDo not penalize students for expressing controversial political or social opinions.\n\nEvaluate the quality of the language and reasoning, not whether the student agrees with a particular position.\n\nDistinguish factual inaccuracies from linguistic mistakes when relevant.\n\nRespect for the student’s voice\n\nDo not transform every answer into a generic, overly diplomatic speech.\n\n⸻\n\n10. ADAPTIVE DIFFICULTY\n\nAdjust difficulty according to performance.\n\nIf the student struggles:\n\n* Reduce the number of constraints.\n* Choose more familiar topics.\n* Encourage shorter sentences.\n* Focus on a limited number of errors.\n\nIf the student performs well:\n\n* Introduce more abstract topics.\n* Encourage complex grammatical structures.\n* Ask unexpected follow-up questions.\n* Increase lexical demands.\n* Introduce time constraints when appropriate.\n\nAvoid changing too many variables simultaneously.\n\n⸻\n\n11. BONUS QUESTIONS\n\nThe student may request extra questions on the same day.\n\nBonus questions:\n\n* Do not automatically increase the daily challenge counter.\n* Are evaluated normally.\n* Can focus on a specific skill or topic.\n* May be shorter than regular challenges.\n\nOnly advance the day counter when the student starts the next daily session or explicitly requests it.\n\nExample:\n\nDay 45 — Main challenge completed.\n\nBonus question — Immigration.\n\nNext scheduled challenge remains Day 46.\n\n⸻\n\n12. EXAM PREPARATION MODE\n\nWhen an examination is approaching, adapt the training.\n\nPrioritize:\n\n* Clear and concise answers.\n* Spontaneous responses.\n* Controlled grammar.\n* Familiar communication structures.\n* Managing unfamiliar topics.\n* Recovering after mistakes.\n* Efficient reasoning.\n\nAvoid introducing excessive new vocabulary immediately before the examination.\n\nDuring the final days, focus on consolidation rather than intensive learning.\n\nDo not guarantee success or invent numerical probabilities of passing.\n\nIf the student is tired or stressed, adjust the workload accordingly.\n\n⸻\n\n13. POST-EXAM MODE\n\nAfter an examination, allow the student to transition to sustainable long-term practice.\n\nReduce pressure and introduce more relaxed topics.\n\nMaintain:\n\n* Daily speaking opportunities.\n* Regular correction.\n* Vocabulary development.\n* Natural conversations.\n* Periodic assessment.\n\nThe challenge counter should continue unless the student explicitly requests a reset.\n\nThe objective shifts from short-term examination performance to long-term language mastery.\n\n⸻\n\n14. CONVERSATIONAL BEHAVIOUR\n\nThe coach must sound like a knowledgeable, attentive tutor rather than an automated grading system.\n\nBe:\n\n* Direct.\n* Precise.\n* Encouraging.\n* Analytical.\n* Professional.\n* Conversational.\n\nAvoid excessive praise such as repeatedly claiming that every answer is “one of the best so far”.\n\nAvoid repeating the same motivational statements after every challenge.\n\nVary the feedback naturally.\n\nIf the student simply wants to chat in English, allow natural conversation without forcing a formal assessment.\n\nIf the student requests corrections only, provide corrections only.\n\nIf the student asks for a detailed assessment, provide a detailed assessment.\n\nNever advance to the next question before giving the requested feedback.\n\nDo not automatically reveal the next daily challenge unless the user requests it or has enabled automatic progression.\n\n⸻\n\n15. INITIALIZATION\n\nWhen a new student begins, ask briefly about:\n\n* Current English level.\n* Target examination.\n* Target level.\n* Preferred challenge duration.\n* Whether audio or text will be used.\n\nIf this information is already available, do not ask again.\n\nStart the first challenge once the necessary information is established.\n\nFor returning students, retrieve their previous progress and continue from the correct day.\n\n⸻\n\n16. PRIMARY OBJECTIVE\n\nYour ultimate goal is not to make the student memorize impressive English expressions.\n\nIt is to help them become someone who can:\n\n* Think spontaneously in English.\n* Communicate clearly under pressure.\n* Discuss unfamiliar topics.\n* Use complex grammar accurately.\n* Express nuanced opinions.\n* Recover naturally from mistakes.\n* Speak confidently without relying on prepared scripts.\n\nThe student should gradually move from translating thoughts into English toward expressing ideas directly and naturally in English.\n\nEvery interaction should contribute to that objective."}</script>
<script>
"use strict";
/* =====================================================================
   APP ATC — preparación Fase 1 ENAIRE (uso personal)
   Datos: banco integrado (solo preguntas generadas, sin material de
   terceros) + banco privado importado por el usuario + progreso. Todo se
   guarda en este dispositivo (IndexedDB, con localStorage de respaldo).
   Ningún dato sale del dispositivo.
   ===================================================================== */
const APP_VERSION = "1.1";
const BUILD = (() => {
  const ua = navigator.userAgent || "";
  const ios = /iP(hone|od|ad)/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let standalone = false; try{ standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches; }catch(e){}
  return {pwa: true, id: "85e3587676", ios, standalone, touch: (navigator.maxTouchPoints||0) > 0};
})();
const MODS = {
  ingles:        {cs:"ING", name:"Inglés",         cls:"ing"},
  psicotecnicos: {cs:"PSI", name:"Psicotécnicos",  cls:"psi"},
  teoria:        {cs:"TEO", name:"Teoría",         cls:"teo"}
};
const LETTERS = "ABCDEF";
const DAY = 86400000;
const SRS_INT = [0, 0, 1, 3, 7, 14]; // días hasta el siguiente repaso según la caja (1..5); caja 1 = hoy mismo

/* ---------------- utilidades ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtRich(s){ // **negrita**, *cursiva*, `código`, saltos de línea
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<i>$2</i>").replace(/`(.+?)`/g, "<code>$1</code>");
  return h.replace(/\n/g, "<br>");
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uid(p="T"){ return p + "-" + Date.now().toString(36).toUpperCase().slice(-5) + Math.random().toString(36).slice(2,5).toUpperCase(); }
function fmtDate(t){ const d=new Date(t); return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}); }
function fmtDur(ms){ const s=Math.max(0,Math.round(ms/1000)); const m=Math.floor(s/60), r=s%60; return (m<10?"0":"")+m+":"+(r<10?"0":"")+r; }
function fmtN(x,d=2){ return (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pct(a,b){ return b ? Math.round(100*a/b) : 0; }
function toast(msg, err=false){ const t=$("#toast"); t.textContent=msg; t.className="toast"+(err?" err":""); t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 3200); }
function safeImg(src){ return (typeof src === "string" && src.length < 3e6 && /^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(src)) ? src : ""; }
function optsClass(q){ if(hasFigOpts(q)) return "figs"; return q.opciones.every(o=>typeof o==="string" && o.trim().length<=6) ? "short" : ""; }
function hasFigOpts(q){ return q.opciones.some(o=>o && typeof o==="object" && (o.img || o.imgRef || o.svg)); }
function figHTML(q, cls="qimg"){ return q.img && safeImg(q.img) ? `<div class="${cls}"><img src="${safeImg(q.img)}" alt="Figura del enunciado"></div>` : (q.imgRef ? `<div class="dim" style="font-size:var(--fs-xs)">(figura no disponible: la pregunta ya no está en el banco)</div>` : ""); }
function safeSVG(str){
  try{
    const doc = new DOMParser().parseFromString(String(str), "image/svg+xml");
    const svg = doc.documentElement;
    if(!svg || svg.nodeName.toLowerCase()!=="svg" || doc.querySelector("parsererror")) return "";
    const bad = new Set(["script","foreignobject","iframe","image","use","a","style","animate","set"]);
    const clean = n => { [...n.attributes||[]].forEach(a=>{ if(/^on/i.test(a.name) || /href$/i.test(a.name)) n.removeAttribute(a.name); }); [...n.children].forEach(c=>{ if(bad.has(c.nodeName.toLowerCase())) c.remove(); else clean(c); }); };
    clean(svg);
    return new XMLSerializer().serializeToString(svg);
  }catch(e){ return ""; }
}
function canShareFile(f){ try{ return !!(f && navigator.share && navigator.canShare && navigator.canShare({files:[f]})); }catch(e){ return false; } }
function anchorDownload(name, blob){
  try{
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast("Descargado: " + name); return true;
  }catch(e){ return false; }
}
function download(name, text){
  const blob = new Blob([text], {type:"application/json"});
  let file = null; try{ file = new File([blob], name, {type:"application/json"}); }catch(e){}
  if(BUILD.ios || (BUILD.touch && canShareFile(file))){
    // iPhone: la hoja de compartir da «Guardar en Archivos». Se abre desde un toque en este diálogo para que Safari la permita.
    openDialog(`<h2>Archivo listo</h2><p class="read" style="margin:0"><code>${esc(name)}</code> · ${Math.max(1,Math.round(blob.size/1024))} KB</p>
      <p class="read muted" style="margin:0;font-size:var(--fs-s)">Pulsa <b>Guardar / compartir</b> y elige <b>Guardar en Archivos</b>. Si no aparece la opción, prueba <b>Descargar</b> o copia el texto.</p>
      <div class="row"><button class="btn primary" id="dl-share" type="button">Guardar / compartir</button><button class="btn" id="dl-a" type="button">Descargar</button><button class="btn ghost" id="dl-txt" type="button">Ver texto</button><button class="btn ghost" data-close type="button">Cerrar</button></div>
      <div id="dl-err" class="ko" style="font-size:var(--fs-s)"></div>`);
    $("#dl-share").onclick = async () => {
      let f = file;
      if(!canShareFile(f)){ try{ const f2 = new File([text], name, {type:"text/plain"}); if(canShareFile(f2)) f = f2; }catch(e){} }
      if(!canShareFile(f)){ $("#dl-err").textContent = "Este navegador no deja compartir archivos. Usa Descargar o Ver texto."; return; }
      try{ await navigator.share({files:[f], title:name}); closeDialog(); toast("Listo: " + name); }
      catch(e){ if(e && e.name === "AbortError") return; $("#dl-err").textContent = "No se pudo compartir (" + (e && e.name || e) + "). Usa Descargar o Ver texto."; }
    };
    $("#dl-a").onclick = () => anchorDownload(name, blob);
    $("#dl-txt").onclick = () => showText("Copia este contenido y guárdalo como " + name, text);
    return;
  }
  if(!anchorDownload(name, blob)) showText("Copia este contenido y guárdalo como " + name, text);
}
function showText(title, text){
  openDialog(`<h2>${esc(title)}</h2><textarea class="input" id="dlg-text" readonly style="min-height:260px">${esc(text)}</textarea>
  <div class="row"><button class="btn primary" id="dlg-copy" type="button">Copiar</button><button class="btn ghost" data-close type="button">Cerrar</button></div>`);
  $("#dlg-copy").onclick = async () => { const ta=$("#dlg-text"); try{ await navigator.clipboard.writeText(ta.value); toast("Copiado"); }catch(e){ ta.focus(); ta.select(); toast("Selecciona y copia con Ctrl+C"); } };
}
function openDialog(html){ const o=$("#overlay"); o.innerHTML=`<div class="dialog" role="dialog" aria-modal="true">${html}</div>`; o.hidden=false; $$("[data-close]",o).forEach(b=>b.onclick=closeDialog); const f=o.querySelector("input,button,textarea"); f&&f.focus(); }
function closeDialog(){ const o=$("#overlay"); o.hidden=true; o.innerHTML=""; }
function confirmBox(title, body, okLabel, danger=false){
  return new Promise(res=>{
    openDialog(`<h2>${esc(title)}</h2><p class="read" style="margin:0">${body}</p><div class="row"><button class="btn ${danger?"danger":"primary"}" id="cf-ok" type="button">${esc(okLabel)}</button><button class="btn ghost" id="cf-no" type="button">Cancelar</button></div>`);
    $("#cf-ok").onclick=()=>{closeDialog();res(true)}; $("#cf-no").onclick=()=>{closeDialog();res(false)};
  });
}

/* ---------------- almacenamiento ---------------- */
const Store = (() => {
  let db = null, mode = "mem"; const mem = {};
  function openDB(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("app-atc",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
  async function init(){
    try{ db = await openDB(); mode="idb"; return mode; }catch(e){}
    try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); mode="ls"; }catch(e){ mode="mem"; }
    return mode;
  }
  function tx(kind, fn){ return new Promise((res,rej)=>{ try{ const t=db.transaction("kv",kind); const s=t.objectStore("kv"); const r=fn(s); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }catch(e){ rej(e); } }); }
  async function get(k){
    try{
      if(mode==="idb") return await tx("readonly", s=>s.get(k)) ?? null;
      if(mode==="ls"){ const v=localStorage.getItem("atc."+k); return v==null?null:JSON.parse(v); }
    }catch(e){ console.warn("get", k, e); }
    return mem[k] ?? null;
  }
  async function set(k,v){
    try{
      if(mode==="idb"){ await tx("readwrite", s=>s.put(v,k)); return true; }
      if(mode==="ls"){ localStorage.setItem("atc."+k, JSON.stringify(v)); return true; }
    }catch(e){ console.warn("set", k, e); toast("No se pudo guardar en el navegador: " + (e.name||e), true); }
    mem[k]=v; return false;
  }
  async function del(k){ try{ if(mode==="idb") await tx("readwrite", s=>s.delete(k)); else if(mode==="ls") localStorage.removeItem("atc."+k); }catch(e){} delete mem[k]; }
  return {init, get, set, del, get mode(){ return mode; }};
})();

/* ---------------- cifrado (AES-GCM + PBKDF2) ---------------- */
const Crypt = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = buf => { let s=""; const b=new Uint8Array(buf); for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const available = () => !!(window.crypto && crypto.subtle && window.isSecureContext !== false);
  async function key(pass, salt){ const base=await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:310000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); }
  async function seal(obj, k, salt){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, enc.encode(JSON.stringify(obj))); return {formato:"atc-cifrado", v:1, salt:b64(salt), iv:b64(iv), ct:b64(ct)}; }
  async function open(box, k){ const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(box.iv)}, k, unb64(box.ct)); return JSON.parse(dec.decode(pt)); }
  return {available, key, seal, open, b64, unb64, newSalt:()=>crypto.getRandomValues(new Uint8Array(16))};
})();

/* ---------------- estado ---------------- */
const S = {
  builtin: [], imported: [], byId: new Map(),
  prog: {attempts:[], q:{}, flags:{}},
  set: {penal:1/3, shuffle:true, dudosas:false, readScale:1, lock:false},
  vault: {key:null, salt:null},
  view: "home", test: null, lastResultId: null
};
function defaultsProg(){ return {attempts:[], q:{}, flags:{}}; }

function rebuildIndex(){
  S.byId = new Map();
  for(const q of S.builtin) S.byId.set(q.id, {...q, _src:"integrada"});
  for(const q of S.imported) S.byId.set(q.id, {...q, _src:"importada"});
  const n = S.byId.size; $("#st-bank").textContent = "BANCO " + n;
}
function allQ(){ return [...S.byId.values()]; }

/* El banco importado puede ocupar decenas de MB (figuras): solo se reescribe cuando cambia.
   El progreso se guarda en cada test. Con contraseña, cada parte va cifrada por separado. */
let bankDirty = false;
const VAULT_KEYS = ["vault", "vault_bank", "vault_prog"];
async function persist(opts={}){
  const bank = !!(opts.bank || bankDirty);
  if(S.set.lock && S.vault.key){
    if(bank) await Store.set("vault_bank", await Crypt.seal(S.imported, S.vault.key, S.vault.salt));
    await Store.set("vault_prog", await Crypt.seal(S.prog, S.vault.key, S.vault.salt));
    if(bank){ await Store.del("vault"); await Store.del("imported"); }
    await Store.del("prog");
  }else{
    if(bank) await Store.set("imported", S.imported);
    await Store.set("prog", S.prog);
  }
  if(bank){ bankDirty = false; await Sync.saveSec(); }
}
async function hasVault(){ for(const k of VAULT_KEYS) if(await Store.get(k)) return true; return false; }
async function openVault(pass){
  const legacy = await Store.get("vault");
  if(legacy){ const k=await Crypt.key(pass, Crypt.unb64(legacy.salt)); const d=await Crypt.open(legacy,k); return {k, salt:Crypt.unb64(legacy.salt), imported:d.imported||[], prog:d.prog||defaultsProg(), legacy:true}; }
  const vb = await Store.get("vault_bank"), vp = await Store.get("vault_prog");
  const ref = vp || vb; if(!ref) return null;
  const k = await Crypt.key(pass, Crypt.unb64(ref.salt));
  const prog = vp ? await Crypt.open(vp, k) : defaultsProg();
  const imported = vb ? await Crypt.open(vb, k) : [];
  return {k, salt:Crypt.unb64(ref.salt), imported, prog};
}
async function saveSettings(){ await Store.set("settings", S.set); applySettings(); }
function applySettings(){ document.documentElement.style.setProperty("--read-scale", S.set.readScale||1); $("#btn-lock").hidden = !(S.set.lock && S.vault.key); }

/* ---------------- sincronización entre dispositivos: repositorio PRIVADO de GitHub del usuario ----------------
   Todo se cifra aquí (AES-GCM, clave derivada de la contraseña de sincronización) antes de subirlo: GitHub solo ve datos cifrados.
   Banco importado por lotes (en partes de ~2,5 MB), progreso (tests, repaso, marcas) en un archivo. Fusión a tres bandas con
   el estado de la última sincronización: lo cambiado en un solo lado gana; si cambia en los dos, se unen las preguntas por id. */
const Sync = (() => {
  const API = () => window.ATC_SYNC_API || "https://api.github.com";
  const DIR = "atc", PART = 2500000;
  const enc = new TextEncoder();
  let SEC = null, running = null, soonT = null, keyC = null;
  const status = {t:0, ok:null, msg:""};
  const cfg = () => S.set.sync || null;
  const locked = () => S.set.lock && !S.vault.key;
  const ready = () => !!(cfg() && cfg().on && cfg().repo && SEC && SEC.token && SEC.pass && Crypt.available() && !locked());
  async function sha(s){ const h = await crypto.subtle.digest("SHA-256", enc.encode(s)); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  function httpMsg(s){ return s===401 ? "token no válido o caducado" : s===403 ? "el token no tiene permiso de escritura en el repositorio" : s===404 ? "no encuentro el repositorio (revisa usuario/nombre y que el token tenga acceso a él)" : (s===409||s===422) ? "conflicto: otro dispositivo estaba guardando a la vez" : "GitHub respondió con error " + s; }
  async function gh(method, path, body, accept){
    let r;
    try{ r = await fetch(`${API()}/repos/${cfg().repo}/contents/${path}`, {method, cache:"no-store",
      headers:{"Authorization":"Bearer " + SEC.token, "Accept": accept || "application/vnd.github+json", ...(body ? {"Content-Type":"application/json"} : {})},
      body: body ? JSON.stringify(body) : undefined}); }
    catch(e){ const x = new Error("sin conexión con GitHub"); x.net = true; throw x; }
    if(r.status === 404 && method === "GET") return null;
    if(!r.ok){ const x = new Error(httpMsg(r.status)); x.status = r.status; throw x; }
    return (accept || "").includes("raw") ? r.text() : r.json();
  }
  const raw = name => gh("GET", `${DIR}/${name}`, null, "application/vnd.github.raw+json");
  async function list(){ const a = await gh("GET", DIR); const m = {}; for(const f of (Array.isArray(a) ? a : [])) m[f.name] = f.sha; return m; }
  async function put(dir, name, text){ const r = await gh("PUT", `${DIR}/${name}`, {message:"APP ATC · " + name, content:Crypt.b64(enc.encode(text)), ...(dir[name] ? {sha:dir[name]} : {})}); dir[name] = r && r.content ? r.content.sha : dir[name]; }
  async function del(dir, name){ if(!dir[name]) return; await gh("DELETE", `${DIR}/${name}`, {message:"APP ATC · borrar " + name, sha:dir[name]}); delete dir[name]; }
  async function key(dir){
    const txt = dir["clave.json"] ? await raw("clave.json") : null;
    if(!txt){
      const salt = Crypt.newSalt(), k = await Crypt.key(SEC.pass, salt);
      const c = {formato:"atc-sync", v:1, salt:Crypt.b64(salt), check:await Crypt.seal("atc", k, salt)};
      await put(dir, "clave.json", JSON.stringify(c)); keyC = {pass:SEC.pass, salt:c.salt, k}; return k;
    }
    const c = JSON.parse(txt);
    if(keyC && keyC.pass === SEC.pass && keyC.salt === c.salt) return keyC.k;
    const k = await Crypt.key(SEC.pass, Crypt.unb64(c.salt));
    let good = false; try{ good = (await Crypt.open(c.check, k)) === "atc"; }catch(e){}

  const loteOf = q => q.lote || "sin lote";
  async function localLotes(){
    const g = new Map();

    const out = {};
    for(const [name, qs] of g){ const s = [...qs].sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0); out[(await sha("lote:" + name)).slice(0,16)] = {name, qs:s, h:await sha(JSON.stringify(s))}; }

  }
  function parts(qs){ const out = []; let cur = [], sz = 0; for(const q of qs){ const s = JSON.stringify(q).length; if(cur.length && sz + s > PART){ out.push(cur); cur = []; sz = 0; } cur.push(q); sz += s; } if(cur.length) out.push(cur); return out; }
  const progSig = p => JSON.stringify([(p.attempts||[]).map(a=>a.id).sort(), Object.entries(p.q||{}).map(([id,s])=>[id, s.last||0, s.n||0]).sort(), Object.entries(p.flags||{}).map(([id,f])=>[id, JSON.stringify(f)]).sort(), speakSig(p)]);
  async function once(){
    const dir = await list();

    idx.lotes = idx.lotes || {}; idx.borrados = idx.borrados || {};
    const st = (await Store.get("sync_state")) || {base:{}};
    st.base = st.base || {};
    const L = await localLotes();
    if(!Object.keys(L).length && Object.keys(st.base).length) st.base = {};   // banco local vacío: nunca se interpreta como «borra todo en la nube»
    let bankCh = false, idxCh = false, up = 0, down = 0, gone = 0;
    const push = async (fid, l) => {
      const ps = parts(l.qs);
      for(let i = 0; i < ps.length; i++) await put(dir, `b_${fid}_${i}.json`, await sealT(ps[i], k));
      for(const n of Object.keys(dir)){ const m = n.match(/^b_([0-9a-f]{16})_(\d+)\.json$/); if(m && m[1] === fid && +m[2] >= ps.length) await del(dir, n); }
      idx.lotes[fid] = {name:l.name, h:l.h, parts:ps.length, n:l.qs.length, t:Date.now()}; delete idx.borrados[fid]; st.base[fid] = l.h; idxCh = true; up++;
    };
    const pull = async (fid, R) => {
      let qs = []; for(let i = 0; i < R.parts; i++) qs = qs.concat(await openT(`b_${fid}_${i}.json`, k));
      S.imported = S.imported.filter(q=>loteOf(q) !== R.name).concat(qs); st.base[fid] = R.h; bankCh = true; down++;

    const remoteDel = async fid => { for(const n of Object.keys(dir)) if(n.startsWith(`b_${fid}_`)) await del(dir, n); delete idx.lotes[fid]; idx.borrados[fid] = Date.now(); delete st.base[fid]; idxCh = true; gone++; };
    for(const fid of new Set([...Object.keys(L), ...Object.keys(idx.lotes), ...Object.keys(st.base)])){
      const l = L[fid], R = idx.lotes[fid], B = st.base[fid];
      if(l && R){
        if(l.h === R.h){ st.base[fid] = l.h; continue; }
        if(R.h === B) await push(fid, l);
        else if(l.h === B) await pull(fid, R);
        else { await pull(fid, R); const ids = new Set(l.qs.map(q=>q.id)); S.imported = S.imported.filter(q=>loteOf(q) !== l.name || !ids.has(q.id)).concat(l.qs); await push(fid, (await localLotes())[fid]); }
      } else if(l){
        if(B && B === l.h && idx.borrados[fid]){ S.imported = S.imported.filter(q=>loteOf(q) !== l.name); delete st.base[fid]; bankCh = true; gone++; }
        else await push(fid, l);
      } else if(R){
        if(B && R.h === B) await remoteDel(fid); else await pull(fid, R);
      } else delete st.base[fid];
    }
    // progreso
    const rp = dir["progreso.json"] ? await openT("progreso.json", k) : null;
    const progCh = rp ? mergeProg(rp) > 0 : false;
    let progUp = false;
    if(!rp || progSig(rp) !== progSig(S.prog)){ await put(dir, "progreso.json", await sealT(S.prog, k)); progUp = true; }
    if(idxCh) await put(dir, "indice.json", await sealT(idx, k));
    if(bankCh) rebuildIndex();
    if(bankCh || progCh) await persist({bank:bankCh});
    st.last = Date.now(); await Store.set("sync_state", st);
    if((bankCh || progCh) && ["home","stats","bank","review","new"].includes(S.view)) go(S.view);
    const bits = [];
    if(up) bits.push(`${up} lote${up>1?"s":""} subido${up>1?"s":""}`);
    if(down) bits.push(`${down} lote${down>1?"s":""} descargado${down>1?"s":""}`);
    if(gone) bits.push(`${gone} lote${gone>1?"s":""} borrado${gone>1?"s":""}`);
    if(progCh) bits.push("progreso de otro dispositivo añadido");
    if(progUp) bits.push("progreso subido");
    return bits.length ? bits.join(" · ") : "todo al día";
  }
  function setStatus(ok, msg){

    const c = $("#st-store"); if(c && cfg() && cfg().on){ c.textContent = ok === null ? "SYNC …" : ok ? "SYNC ✓" : "SYNC !"; c.title = msg; }

  }
  async function run(manual){

    if(S.test && !S.test.ended){ soon(60000); return false; }

})();

/* une el progreso de otro dispositivo (tests por id; por pregunta gana lo más reciente; marcas por fecha) */
function mergeProg(P){
  let n = 0;
  const ids = new Set(S.prog.attempts.map(a=>a.id));
  for(const a of (P.attempts || [])) if(!ids.has(a.id)){ S.prog.attempts.push(a); n++; }
  S.prog.attempts.sort((a,b)=>a.fecha-b.fecha);
  for(const [id,s] of Object.entries(P.q || {})){ const m = S.prog.q[id]; if(!m || (s.last||0) > (m.last||0)){ S.prog.q[id] = s; n++; } }
  for(const [id,f] of Object.entries(P.flags || {})){ const m = S.prog.flags[id]; if(!m || (f.t||0) > (m.t||0)){ if(JSON.stringify(m) !== JSON.stringify(f)){ S.prog.flags[id] = f; n++; } } }
  n += mergeSpeak(P);
  return n;
}

/* ---------------- validación e importación ---------------- */
const VALID_MOD = Object.keys(MODS);
function normQ(raw, i, errs, warns){
  const where = `#${i+1}${raw && raw.id ? " ("+raw.id+")" : ""}`;
  if(!raw || typeof raw!=="object"){ errs.push(where+": no es un objeto"); return null; }
  const q = {...raw};
  if(typeof q.id!=="string" || !q.id.trim()){ errs.push(where+": falta 'id'"); return null; }
  q.id = q.id.trim();
  if(!VALID_MOD.includes(q.modulo)){ errs.push(where+": 'modulo' debe ser ingles, psicotecnicos o teoria"); return null; }
  if((typeof q.enunciado!=="string" || !q.enunciado.trim()) && !q.svg && !q.img){ errs.push(where+": falta 'enunciado'"); return null; }
  if(q.img && !safeImg(q.img)){ warns.push(where+": 'img' debe ser una imagen incrustada (data:image/…;base64); se ignora"); delete q.img; }
  if(q.img_sol && !safeImg(q.img_sol)){ warns.push(where+": 'img_sol' debe ser una imagen incrustada (data:image/…;base64); se ignora"); delete q.img_sol; }
  if(q.clave_academia && !q.clave_original) q.clave_original = q.clave_academia; delete q.clave_academia;
  if(!Array.isArray(q.opciones) || q.opciones.length<2 || q.opciones.length>6){ errs.push(where+": 'opciones' debe tener entre 2 y 6 elementos"); return null; }
  for(const o of q.opciones){ if(!(typeof o==="string" || (o && typeof o==="object" && (o.texto||o.svg||(o.img&&safeImg(o.img)))))){ errs.push(where+": opción no válida"); return null; } }
  if(!Number.isInteger(q.correcta) || q.correcta<0 || q.correcta>=q.opciones.length){ errs.push(where+": 'correcta' debe ser el índice (0 = A) de una opción existente"); return null; }
  if(!["archivo","generada"].includes(q.origen)){ warns.push(where+": 'origen' no indicado; se asume 'archivo'"); q.origen="archivo"; }
  if(!q.tema) q.tema = "General";
  if(!q.explicacion) warns.push(where+": sin explicación");
  if(q.revision!=="dudosa") q.revision="ok";
  if(q.descartes && (!Array.isArray(q.descartes) || q.descartes.length!==q.opciones.length)){ warns.push(where+": 'descartes' no coincide con las opciones; se ignora"); delete q.descartes; }
  return q;
}
function parseBank(text){
  let data; const errs=[], warns=[];
  try{ data = JSON.parse(text); }catch(e){ return {ok:false, errs:["El texto no es JSON válido: "+e.message], warns, qs:[]}; }
  if(data && data.formato==="atc-cifrado") return {ok:false, encrypted:true, data, errs:[], warns, qs:[]};
  let list = Array.isArray(data) ? data : (data && Array.isArray(data.preguntas) ? data.preguntas : null);
  if(!list) return {ok:false, errs:["No encuentro la lista de preguntas. Debe ser un array o un objeto con 'preguntas'."], warns, qs:[]};
  const qs=[], seen=new Set();
  list.forEach((r,i)=>{ const q=normQ(r,i,errs,warns); if(q){ if(seen.has(q.id)) errs.push(`#${i+1}: id duplicado dentro del archivo (${q.id})`); else { seen.add(q.id); qs.push(q); } } });
  return {ok:qs.length>0, errs, warns, qs, meta: Array.isArray(data)?{}:{nombre:data.nombre, version:data.version, fecha:data.fecha}};
}
async function importQs(qs){
  const idx = new Map(S.imported.map((q,i)=>[q.id,i])); let nuevas=0, act=0, sobre=0;
  for(const q of qs){
    if(idx.has(q.id)){ S.imported[idx.get(q.id)] = q; act++; }
    else { if(S.builtin.some(b=>b.id===q.id)) sobre++; S.imported.push(q); idx.set(q.id, S.imported.length-1); nuevas++; }
  }
  rebuildIndex(); await persist({bank:true}); Sync.soon();
  return {nuevas, act, sobre};
}

/* ---------------- motor de test ---------------- */
function qStat(id){ return S.prog.q[id] || null; }
function isDue(id, now=Date.now()){ const s=qStat(id); return !!(s && s.box>=1 && s.box<=5 && s.due<=now); }
function dueList(mod){ const now=Date.now(); return allQ().filter(q=>(!mod||q.modulo===mod) && isDue(q.id,now) && S.byId.has(q.id)); }
function pendingFails(mod){ return allQ().filter(q=>(!mod||q.modulo===mod) && (S.prog.q[q.id]?.box>=1 && S.prog.q[q.id]?.box<=5)); }
function refersToPositions(q){ return q.fijarOrden || q.opciones.some(o=>typeof o==="string" && /\b(all (of the )?(above|correct)|both|none of|neither|a and b|b and c|todas|ninguna|ambas|all are)\b/i.test(o)); }

function buildPool(cfg){
  let pool = allQ().filter(q=>q.modulo===cfg.mod);
  if(cfg.origen!=="todas") pool = pool.filter(q=>q.origen===cfg.origen);
  if(cfg.temas && cfg.temas.length) pool = pool.filter(q=>cfg.temas.includes(q.tema));
  if(!cfg.dudosas) pool = pool.filter(q=>q.revision!=="dudosa" && !S.prog.flags[q.id]?.dudosa);
  if(cfg.modo==="repaso") pool = pool.filter(q=>isDue(q.id));
  if(cfg.modo==="fallos") pool = pool.filter(q=>(S.prog.q[q.id]?.ko||0)+(S.prog.q[q.id]?.bl||0)>0);
  if(cfg.modo==="nuevas") pool = pool.filter(q=>!S.prog.q[q.id]);
  return pool;
}
function pickQuestions(cfg){
  let pool = buildPool(cfg);
  if(cfg.modo==="normal"){ // prioriza no vistas y falladas, sin repetir lo recién visto
    const now=Date.now();
    pool = shuffle(pool).map(q=>{ const s=S.prog.q[q.id]; let w=Math.random(); if(!s) w+=1.2; else { if(s.lastOk===false) w+=0.9; if(now-(s.last||0)<DAY) w-=0.8; } return {q,w}; }).sort((a,b)=>b.w-a.w).map(x=>x.q);
  }else pool = shuffle(pool);
  return pool.slice(0, cfg.n);
}
function startTest(cfg){
  const qs = pickQuestions(cfg);
  if(!qs.length){ toast("No hay preguntas que cumplan esos filtros", true); return; }
  const items = qs.map(q=>{
    const n=q.opciones.length; let perm=[...Array(n).keys()];
    if(cfg.shuffle && !refersToPositions(q)) perm = shuffle(perm);
    return {id:q.id, perm, ans:null, flag:false, t:0};
  });
  S.test = {id:uid("TST"), cfg, items, cur:0, start:Date.now(), qStart:Date.now(), ended:false, reveal:{}};
  document.body.classList.add("in-test");
  go("test");
}
function curItem(){ return S.test.items[S.test.cur]; }
function trackTime(){ const T=S.test; if(!T || T.hiddenAt) return; const it=T.items[T.cur]; const now=Date.now(); it.t += Math.max(0, now-T.qStart); T.qStart=now; }
function snapOf(q){ // copia de la pregunta para el historial; las imágenes se referencian (se recuperan del banco al revisar)
  const opciones = q.opciones.map(o => (o && typeof o==="object" && o.img) ? {texto:o.texto, svg:o.svg, imgRef:true} : o);
  return {enunciado:q.enunciado, contexto:q.contexto, svg:q.svg, imgRef:q.img?true:undefined, imgSolRef:q.img_sol?true:undefined, opciones, correcta:q.correcta, explicacion:q.explicacion, descartes:q.descartes, tema:q.tema, origen:q.origen, fuente:q.fuente, revision:q.revision, nota_revision:q.nota_revision, nivel:q.nivel, clave_original:q.clave_original};
}
function hydrate(id, snap){
  if(!snap.imgRef && !snap.imgSolRef && !snap.opciones.some(o=>o && o.imgRef)) return snap;
  const live = S.byId.get(id);
  return {...snap, img: snap.imgRef && live ? live.img : undefined, imgRef: snap.imgRef && !(live && live.img),
    img_sol: snap.imgSolRef && live ? live.img_sol : undefined,
    opciones: snap.opciones.map((o,i)=> o && o.imgRef ? (live && live.opciones[i] && live.opciones[i].img ? {...o, img:live.opciones[i].img, imgRef:false} : o) : o)};
}
function scoreItems(items, penal){
  let ok=0, ko=0, bl=0;
  for(const it of items){ const q=S.byId.get(it.id) || it.snap; if(it.ans==null) bl++; else if(it.ans===q.correcta) ok++; else ko++; }
  const n=items.length, net=ok-ko*penal; return {n, ok, ko, bl, net, nota: n? net*10/n : 0};
}
async function finishTest(reason){
  const T=S.test; if(!T || T.ended) return; trackTime(); T.ended=true; clearInterval(timerH);
  const penal = T.cfg.penal;
  const sc = scoreItems(T.items, penal);
  const now = Date.now();
  const att = {id:T.id, fecha:now, mod:T.cfg.mod, modo:T.cfg.modo, cfg:T.cfg, dur:now-T.start, motivo:reason||"fin",
    items:T.items.map(it=>{ const q=S.byId.get(it.id); return {id:it.id, ans:it.ans, perm:it.perm, flag:it.flag, t:it.t, c:q.correcta, tema:q.tema, snap:snapOf(q)}; }),
    sc};
  // estadísticas por pregunta + repetición espaciada (cajas 1–5; 6 = dominada)
  for(const it of T.items){
    const q=S.byId.get(it.id); const s=S.prog.q[it.id] || {n:0, ok:0, ko:0, bl:0, box:0, due:0, last:0};
    s.n++; s.last=now;
    const right = it.ans!=null && it.ans===q.correcta;
    if(it.ans==null) s.bl++; else if(right) s.ok++; else s.ko++;
    s.lastOk = right; s.lastAns = it.ans;
    if(!right){ s.box=1; s.due=now + DAY*SRS_INT[1]; }
    else if(s.box>=1){ s.box = s.box+1; s.due = s.box<=5 ? now + DAY*SRS_INT[s.box] : 0; }
    S.prog.q[it.id]=s;
  }
  S.prog.attempts.push(att);
  await persist(); await Store.del("cur");
  document.body.classList.remove("in-test");
  S.lastResultId = att.id; S.test = null; Sync.soon(1500);
  if(reason==="tiempo") toast("Tiempo agotado: test finalizado");
  go("result");
}

function dayStr(d=new Date()){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function hashN(str){ let h = 2166136261; for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(arr, seed){ const a = arr.slice(); let s = hashN(seed) || 1; const r = () => (s = (Math.imul(s, 1103515245) + 12345) >>> 0) / 4294967296; for(let i = a.length-1; i > 0; i--){ const j = Math.floor(r()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function spkItem(id){ return SPK().items.find(x => x.id === id) || null; }
function spkPhase(day){ const st = Math.min(5, Math.max(1, spk().cfg.start || 1)); const n = day - 1 + SPK_PHASE_DAY[st-1]; let p = 1; SPK_PHASE_DAY.forEach((d,i) => { if(n >= d) p = i + 1; }); return p; }
function spkCatFor(day){ if(day % 3 === 0) return "aviation"; const p = spkPhase(day); if(p < 5) return ["personal","pro","abstract","world"][p-1]; return ["pro","world","abstract","world","pro","personal"][hashN("mix" + day) % 6]; }
function spkUsed(){ const u = new Set(spk().skip); for(const s of Object.values(spk().sessions)) u.add(s.cid); return u; }
function spkPick(cat, random=false, exclude=new Set()){
  const B = SPK(), pool = B.items.filter(x => (cat === "any" || x.cat === cat) && !exclude.has(x.id));
  if(!pool.length) return B.items[0] || null;
  const used = spkUsed(), fresh = pool.filter(x => !used.has(x.id));
  if(random){ const src = fresh.length ? fresh : pool; return src[Math.floor(Math.random()*src.length)]; }
  const ord = seeded(fresh.length ? fresh : pool, "cat:" + cat);
  if(fresh.length) return ord[0];
  const last = {}; for(const s of Object.values(spk().sessions)) last[s.cid] = Math.max(last[s.cid] || 0, s.t || 0);
  return ord.sort((a,b) => (last[a.id]||0) - (last[b.id]||0))[0];
}
function spkConds(item, day, phase){
  const B = SPK(); const lvl = phase <= 1 ? 1 : phase <= 3 ? 2 : 3, n = phase <= 1 ? 2 : 3;
  const pool = B.conditions.map((c,i) => ({...c, i})).filter(c => c.lvl <= lvl);
  const pref = seeded(pool.filter(c => (c.k||[]).includes(item.k)), "p:" + item.id + ":" + day);
  const out = [], groups = new Set();
  const add = c => { if(out.length >= n || out.includes(c.i) || (c.g && groups.has(c.g))) return; out.push(c.i); if(c.g) groups.add(c.g); };
  if(pref.length) add(pref[0]);
  for(const c of seeded(pool, "r:" + item.id + ":" + day)) add(c);
  return out;
}
function spkMain(){ return Object.values(spk().sessions).filter(x => x.kind === "main").sort((a,b) => (a.day||0) - (b.day||0) || a.t - b.t); }
function spkToday(){
  const s = spk(), t = dayStr(), mains = spkMain();
  const done = mains.find(x => x.date === t);
  if(done) return {day:done.day, item:spkItem(done.cid) || {id:done.cid, topic:done.topic, q:done.q, f:"", k:"opinion", cat:done.cat}, conds:done.conds || [], done, phase:spkPhase(done.day)};
  const day = Math.max(0, ...mains.map(x => x.day || 0)) + 1;
  if(s.assign && s.assign.date === t && s.assign.day === day && spkItem(s.assign.cid)) return {day, item:spkItem(s.assign.cid), conds:s.assign.conds || [], done:null, phase:spkPhase(day)};
  const item = spkPick(spkCatFor(day)); if(!item) return null;
  const conds = spkConds(item, day, spkPhase(day));
  s.assign = {date:t, day, cid:item.id, conds, t:Date.now()};
  persist(); Sync.soon();
  return {day, item, conds, done:null, phase:spkPhase(day)};
}
function spkStats(){
  const all = Object.values(spk().sessions), mains = all.filter(x => x.kind === "main");
  const dates = new Set(mains.map(x => x.date));
  let streak = 0; const d = new Date(); if(!dates.has(dayStr(d))) d.setDate(d.getDate()-1);
  while(dates.has(dayStr(d))){ streak++; d.setDate(d.getDate()-1); }
  const ms = all.reduce((a,x) => a + (x.parts||[]).reduce((b,p) => b + (p.ms||0), 0), 0);
  const cefr = all.filter(x => x.cefr).sort((a,b) => a.t - b.t);
  return {n:mains.length, bonus:all.length - mains.length, streak, min:ms/60000, lastCefr: cefr.length ? cefr[cefr.length-1].cefr : null, dates};
}
function spkAvg(s){ const v = Object.values(s.rate || {}).filter(x => x > 0); return v.length ? v.reduce((a,b) => a+b, 0)/v.length : null; }
function spkSave(){ return persist().then(() => Sync.soon()); }

/* ---- audio: solo en este dispositivo; cifrado con la contraseña de la app si está activada ---- */
const Aud = {
  key: (sid, i) => `aud_${sid}_${i}`,
  ok: () => Store.mode === "idb",
  async put(sid, i, blob){
    if(!Aud.ok() || !blob) return false;
    const buf = await blob.arrayBuffer(); let rec = {type:blob.type, buf};
    if(S.set.lock && S.vault.key){ const iv = crypto.getRandomValues(new Uint8Array(12)); rec = {type:blob.type, iv:Crypt.b64(iv), ct: await crypto.subtle.encrypt({name:"AES-GCM", iv}, S.vault.key, buf)}; }
    return Store.set(Aud.key(sid, i), rec);
  },
  async get(sid, i){
    const r = await Store.get(Aud.key(sid, i)); if(!r) return null;
    let buf = r.buf;
    if(r.ct){ if(!S.vault.key) return null; try{ buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:Crypt.unb64(r.iv)}, S.vault.key, r.ct); }catch(e){ return null; } }
    return buf ? new Blob([buf], {type:r.type || "audio/mp4"}) : null;
  },
  async del(sid){ for(let i = 0; i < 4; i++) await Store.del(Aud.key(sid, i)); },
  async prune(){
    const keep = spkSet().keep || 20;
    const withA = Object.values(spk().sessions).filter(x => x.audio).sort((a,b) => b.t - a.t);
    let ch = false;
    for(const s of withA.slice(keep)){ await Aud.del(s.id); s.audio = 0; s.upd = Date.now(); ch = true; }
    return ch;
  },
  async reseal(oldKey=null){ // al activar o quitar la contraseña: cada audio se vuelve a guardar cifrado o en claro, según toque
    for(const s of Object.values(spk().sessions)) if(s.audio) for(let i = 0; i < (s.parts||[]).length; i++){
      const r = await Store.get(Aud.key(s.id, i)); if(!r) continue;
      let buf = r.buf;
      if(r.ct){ const k = oldKey || S.vault.key; if(!k) continue; try{ buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:Crypt.unb64(r.iv)}, k, r.ct); }catch(e){ continue; } }
      if(buf) await Aud.put(s.id, i, new Blob([buf], {type:r.type}));
    }
  }
};
function recMime(){ for(const m of ["audio/mp4;codecs=mp4a.40.2", "audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"]){ try{ if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }catch(e){} } return ""; }
function audExt(type){ return /mp4|m4a|aac/.test(type||"") ? "m4a" : /ogg/.test(type||"") ? "ogg" : "webm"; }

/* ---- grabación ---- */
async function spkStartPart(label, question){
  const cfg = spkSet(), T = SPKS;
  T.cur = {label, q:question, t0:0, ms:0, chunks:[], blob:null, live:""};
  T.phase = "prep";
  const prep = label === "main" ? (spk().cfg.prep || 0) : 0;
  vSpeak($("#v-speak"));
  // el micrófono se pide ya (dentro del toque) para que el navegador lo permita
  if(cfg.rec && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder){
    try{
      T.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
    }catch(e){ T.stream = null; toast(e && e.name === "NotAllowedError" ? "Sin permiso de micrófono: solo se cronometra" : "No se pudo abrir el micrófono: solo se cronometra", true); }
  } else T.stream = null;
  try{ if(navigator.wakeLock) T.wake = await navigator.wakeLock.request("screen"); }catch(e){ T.wake = null; }
  if(prep > 0){
    const end = Date.now() + prep*1000;
    await new Promise(res => { T.prepT = setInterval(() => { const left = Math.ceil((end - Date.now())/1000); const el = $("#sp-prep"); if(el) el.textContent = left > 0 ? left : 0; if(left <= 0 || !SPKS || SPKS.phase !== "prep"){ clearInterval(T.prepT); res(); } }, 200); });
    if(!SPKS || SPKS.phase !== "prep") return;
  }
  T.phase = "rec"; T.cur.t0 = Date.now();
  if(T.stream){
    try{
      const mime = recMime(); const mr = new MediaRecorder(T.stream, mime ? {mimeType:mime, audioBitsPerSecond:64000} : {audioBitsPerSecond:64000});
      mr.ondataavailable = e => { if(e.data && e.data.size) T.cur.chunks.push(e.data); };
      T.mr = mr; mr.start(1000);
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ T.ac = new AC(); const src = T.ac.createMediaStreamSource(T.stream); T.an = T.ac.createAnalyser(); T.an.fftSize = 512; src.connect(T.an); }
    }catch(e){ T.mr = null; toast("No se pudo grabar en este navegador: solo se cronometra", true); }
  }
  if(cfg.live && SpeechRec){
    try{
      const sr = new SpeechRec(); sr.lang = "en-GB"; sr.continuous = true; sr.interimResults = true;
      sr.onresult = e => { let fin = "", tmp = ""; for(let i = 0; i < e.results.length; i++){ const r = e.results[i]; if(r.isFinal) fin += r[0].transcript + " "; else tmp += r[0].transcript; } T.cur.live = (T.cur.liveDone || "") + fin; T.cur.interim = tmp; const el = $("#sp-live"); if(el) el.textContent = (T.cur.live + tmp).trim() || "…"; };
      sr.onerror = e => { if(["not-allowed","service-not-allowed","audio-capture","network"].includes(e.error)){ T.srDead = true; const el = $("#sp-live"); if(el) el.textContent = "Transcripción automática no disponible aquí. Podrás escribir o dictar tu respuesta después."; } };
      sr.onend = () => { if(SPKS && SPKS.phase === "rec" && !T.srDead){ T.cur.liveDone = T.cur.live; try{ sr.start(); }catch(e){} } };
      T.sr = sr; sr.start();
    }catch(e){ T.sr = null; }
  }
  vSpeak($("#v-speak"));
  T.tick = setInterval(spkTick, 200);
}
function spkTick(){
  const T = SPKS; if(!T || T.phase !== "rec") return;
  const ms = Date.now() - T.cur.t0;
  const tEl = $("#sp-time"); if(tEl) tEl.textContent = fmtDur(ms);
  const bar = $("#sp-fill"); if(bar) bar.style.width = Math.min(100, ms/1800) + "%";
  const hint = $("#sp-hint"); if(hint) hint.textContent = ms < 60000 ? "Objetivo: al menos 1 minuto" : ms < 120000 ? "Bien: estás en la franja de 1 a 2 minutos" : "Más de 2 minutos: cierra con una conclusión";
  if(T.an){ const a = new Uint8Array(T.an.fftSize); T.an.getByteTimeDomainData(a); let m = 0; for(const v of a) m = Math.max(m, Math.abs(v - 128)); const l = $("#sp-lvl"); if(l) l.style.width = Math.min(100, m/1.1) + "%"; }
  if(ms > 5*60000) spkStopPart();
}
async function spkStopPart(cancel=false){
  const T = SPKS; if(!T) return;
  clearInterval(T.tick); clearInterval(T.prepT);
  const wasRec = T.phase === "rec";
  T.phase = "stopping";
  if(T.sr){ try{ T.sr.onend = null; T.sr.stop(); }catch(e){} T.sr = null; }
  if(T.mr && T.mr.state !== "inactive"){ await new Promise(res => { T.mr.onstop = res; try{ T.mr.stop(); }catch(e){ res(); } }); }
  if(T.stream) T.stream.getTracks().forEach(t => t.stop());
  if(T.ac) try{ T.ac.close(); }catch(e){}
  if(T.wake) try{ T.wake.release(); }catch(e){}
  const cur = T.cur; T.mr = null; T.stream = null; T.ac = null; T.an = null; T.wake = null;
  if(cancel || !wasRec){ T.cur = null; T.phase = T.parts.length ? "review" : "idle"; if(!T.parts.length) SPKS = null; vSpeak($("#v-speak")); return; }
  cur.ms = Date.now() - cur.t0;
  if(cur.chunks.length){ cur.blob = new Blob(cur.chunks, {type: cur.chunks[0].type || recMime() || "audio/webm"}); cur.url = URL.createObjectURL(cur.blob); }
  cur.text = ((cur.live || "") + (cur.interim || "")).trim();
  T.parts.push(cur); T.cur = null; T.phase = "review";
  vSpeak($("#v-speak"));
}
function spkBegin(mode, info){
  if(SPKS && SPKS.phase !== "idle" && SPKS.phase !== "saved"){ toast("Ya hay una sesión en curso", true); return; }
  SPKS = {mode, day:info.day, item:info.item, conds:info.conds, phase:"idle", parts:[]};
  spkStartPart("main", info.item.q);
}

function coachText(){ return (S.set.coach && S.set.coach.trim()) || SPK().coach || ""; }
function spkPrompt(se){
  const B = SPK(), it = spkItem(se.cid) || {topic:se.topic, q:se.q, f:se.fu || "", k:se.k};
  const conds = (se.conds || []).map(i => B.conditions[i] && B.conditions[i].t).filter(Boolean);
  const parts = se.parts || [];
  const L = [];
  L.push(coachText(), "", "──────── SESSION DATA (from my training app) ────────");
  L.push("Student: Spanish-speaking candidate preparing the ENAIRE air traffic controller selection (Phase 3, oral English). Target level: C1. Do not ask the initialization questions again: this is a returning student.");
  L.push("", `DAY ${se.day} — SPEAKING CHALLENGE${se.kind === "bonus" ? " (bonus question: it does not advance the day counter)" : ""}`);
  L.push(`Topic: ${it.topic}`, `Question: "${it.q}"`);
  if(conds.length){ L.push("Conditions:"); conds.forEach(c => L.push("- " + c)); }
  L.push(`Focus: ${B.focus[it.k] || ""}`);
  if(parts[1]) L.push(`Follow-up question: "${parts[1].q}"`);
  L.push("", "Speaking time: " + parts.map((p,i) => `${fmtDur(p.ms)} (${i ? "follow-up" : "main answer"})`).join(" · ") + ". Recommended: 1–2 minutes.");
  const r = Object.entries(se.rate || {}).filter(([,v]) => v > 0).map(([k,v]) => `${SPK_DIMS_EN[k]} ${v}/5`);
  if(r.length) L.push("My self-assessment: " + r.join(", ") + ".");
  if(se.blanks != null) L.push("Blank moments (self-reported): " + ["none","one","several"][se.blanks] + ".");
  const met = conds.filter((c,i) => (se.condsOk || [])[i]);
  if(conds.length) L.push("Conditions I believe I met: " + (met.length ? met.join(" | ") : "none") + ".");
  if(se.notes) L.push("My notes: " + se.notes);
  L.push("");
  if(se.transcript && se.transcript.trim()){
    L.push(`My answer — ${se.trAuto ? "automatic speech-recognition transcript (it may contain recognition errors; pronunciation cannot be assessed from it)" : "transcript"}:`, '"""', se.transcript.trim(), '"""', "", "Please give your feedback following section 6 (A–E).");
  } else {
    L.push("I will send my answer (audio or transcript) in my next message. When you receive it, give your feedback following section 6 (A–E).");
  }
  return L.join("\n");
}
function spkProgressPrompt(){
  const ss = Object.values(spk().sessions).sort((a,b) => a.t - b.t).slice(-10);
  const L = [coachText(), "", "──────── PROGRESS DATA (from my training app) ────────",
    "Student: Spanish-speaking candidate preparing the ENAIRE air traffic controller selection (Phase 3, oral English). Target level: C1.",
    `Recorded sessions: ${ss.length} (most recent last). Use only this evidence; if it is not enough for a reliable comparison, say so.`, ""];
  for(const s of ss){
    const a = spkAvg(s), p = (s.parts||[]).reduce((x,y) => x + (y.ms||0), 0);
    L.push(`- ${s.date} · Day ${s.day}${s.kind === "bonus" ? " (bonus)" : ""} · ${s.topic} · ${fmtDur(p)}${a ? ` · self-assessment ${a.toFixed(1)}/5` : ""}${s.blanks != null ? ` · blank moments: ${["none","one","several"][s.blanks]}` : ""}${s.cefr ? ` · CEFR estimate given by the coach: ${s.cefr}` : ""}${s.takeaway ? ` · key takeaway: ${s.takeaway}` : ""}`);
  }
  L.push("", "Please give me a progress assessment following section 8: improvements, persistent weaknesses, new difficulties and recommended training priorities.");
  return L.join("\n");
}

/* fusión entre dispositivos: sesiones por id (gana la última edición), borrados, ajustes y reto del día por fecha */
function mergeSpeak(P){
  if(!P || !P.speak) return 0;
  const R = P.speak, L = spk(); let n = 0;
  L.gone = L.gone || {};
  for(const [id, t] of Object.entries(R.gone || {})){ if(!L.gone[id]){ L.gone[id] = t; n++; } if(L.sessions[id]){ delete L.sessions[id]; Aud.del(id); n++; } }
  for(const [id, s] of Object.entries(R.sessions || {})){ if(L.gone[id]) continue; const m = L.sessions[id]; if(!m || (s.upd||0) > (m.upd||0)){ L.sessions[id] = m ? {...s, audio:m.audio} : {...s, audio:0}; n++; } }
  if(R.cfg && (R.cfg.t||0) > (L.cfg.t||0)){ L.cfg = {...R.cfg}; n++; }
  if(R.assign && (!L.assign || (R.assign.t||0) > (L.assign.t||0))){ L.assign = {...R.assign}; n++; }
  const sk = new Set(L.skip); for(const x of R.skip || []) if(!sk.has(x)){ L.skip.push(x); n++; }
  return n;
}
function speakSig(p){ const s = p.speak || {}; return [Object.entries(s.sessions||{}).map(([id,x]) => [id, x.upd||0]).sort(), Object.keys(s.gone||{}).sort(), (s.cfg||{}).t||0, (s.assign||{}).t||0, (s.skip||[]).length]; }

function modStats(mod){
