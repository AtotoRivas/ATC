/* Layout: consola de torre — barra de estado fija arriba, pestañas (abajo en móvil), paneles tipo pantalla radar y fichas de progresión de vuelo. Tema oscuro único, deliberado. */
:root{
  color-scheme: dark;
  --bg:#0a1013;          /* fondo de pantalla radar */
  --scope:#0d161a;       /* paneles */
  --scope-2:#122027;     /* paneles elevados */
  --line:#1e3139;        /* bordes, rejilla */
  --line-2:#2b4550;
  --fg:#d3e2da;          /* texto fósforo suave */
  --muted:#8aa196;
  --dim:#56706a;
  --green:#52d68f;       /* OK / acierto / módulo teoría */
  --green-bg:rgba(82,214,143,.10);
  --amber:#f0b33f;       /* aviso / marcada / archivo */
  --amber-bg:rgba(240,179,63,.10);
  --red:#ff6a5c;         /* conflicto / fallo */
  --red-bg:rgba(255,106,92,.10);
  --cyan:#69c6de;        /* selección / módulo inglés */
  --cyan-bg:rgba(105,198,222,.12);
  --font-ui:"B612 Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --font-read:"B612", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --fs-xs:.72rem; --fs-s:.82rem; --fs-m:.95rem; --fs-l:1.12rem; --fs-xl:1.45rem; --fs-xxl:2.4rem;
  --read-scale:1;
  --r:3px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 85% -10%, rgba(82,214,143,.05), transparent 45%),
    linear-gradient(rgba(82,214,143,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(82,214,143,.022) 1px, transparent 1px);
  background-size:auto, 32px 32px, 32px 32px;
  background-attachment:fixed;
}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--font-ui)}
.read{font-family:var(--font-read)}
.tab-num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.ok{color:var(--green)} .ko{color:var(--red)} .warn{color:var(--amber)} .sel{color:var(--cyan)}
h1,h2,h3{font-family:var(--font-ui);font-weight:700;letter-spacing:.04em;text-wrap:balance;margin:0}
h2{font-size:var(--fs-l);text-transform:uppercase}
h3{font-size:var(--fs-m);text-transform:uppercase;color:var(--muted)}
.label{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,16,19,.96);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding-block:10px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:1.05rem;letter-spacing:.18em;color:var(--green)}
.brand span{font-size:var(--fs-xs);letter-spacing:.14em;color:var(--muted);white-space:nowrap}
.status{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:var(--fs-s);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);padding:2px 8px;border-radius:var(--r);font-size:var(--fs-xs);letter-spacing:.08em;white-space:nowrap;text-transform:uppercase}
.chip.ok{border-color:rgba(82,214,143,.45);color:var(--green)}
.chip.warn{border-color:rgba(240,179,63,.5);color:var(--amber)}
.chip.ko{border-color:rgba(255,106,92,.5);color:var(--red)}
.chip.sel{border-color:rgba(105,198,222,.5);color:var(--cyan)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.iconbtn{background:none;border:1px solid var(--line-2);border-radius:var(--r);padding:3px 9px;cursor:pointer;font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--muted)}

/* ---------- tabs ---------- */
.tabs{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;font-size:var(--fs-s);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--green);border-bottom-color:var(--green)}
.tab .n{color:var(--amber);margin-left:4px}

main{max-width:1120px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(90px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:18px}

/* ---------- panels ---------- */
.panel{background:var(--scope);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
hr.sep{border:none;border-top:1px dashed var(--line-2);margin:4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--scope-2);border:1px solid var(--line-2);color:var(--fg);padding:9px 14px;border-radius:var(--r);cursor:pointer;font-size:var(--fs-s);letter-spacing:.1em;text-transform:uppercase;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.btn.primary:hover{background:rgba(82,214,143,.18)}
.btn.amber{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.btn.danger{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;min-height:32px;font-size:var(--fs-xs)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* form controls */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.input,select.input,textarea.input{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;color:var(--fg);min-height:40px;width:100%}
textarea.input{min-height:160px;font-family:var(--font-ui);font-size:var(--fs-s);line-height:1.45;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-size:var(--fs-s);letter-spacing:.06em;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-bg)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:var(--fs-s)}
.check input{margin-top:3px;accent-color:var(--green);width:16px;height:16px}

/* ---------- flight strips ---------- */
.strip{display:grid;grid-template-columns:10px minmax(0,1.4fr) repeat(3,minmax(0,1fr)) 12.5rem;align-items:stretch;background:var(--scope-2);border:1px solid var(--line-2);border-radius:2px;min-height:64px}
.strip>*{padding:8px 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:0}
.strip>.band{padding:0;border-left:none;background:var(--cyan)}
.strip.psi>.band{background:var(--amber)} .strip.teo>.band{background:var(--green)}
.strip .cs{font-size:1.15rem;font-weight:700;letter-spacing:.12em}
.strip .v{font-size:1.05rem;font-variant-numeric:tabular-nums}
.strip .acts{flex-direction:row;align-items:center;gap:6px;flex-wrap:wrap}
@media (max-width:760px){
  .strip{grid-template-columns:8px repeat(3,minmax(0,1fr))}
  .strip>.cs-box{grid-column:2 / -1;border-left:none;border-bottom:1px solid var(--line)}
  .strip>.acts{grid-column:2 / -1;border-left:none;border-top:1px solid var(--line)}
  .strip>.band{grid-row:1 / span 3}
}

/* ---------- radar ---------- */
.radar-wrap{position:relative;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:640px){.radar-wrap{grid-template-columns:1fr}}
.radar{width:100%;max-width:360px;aspect-ratio:344/312;margin:0 auto;display:block}
.sweep{transform-origin:150px 150px;animation:sweep 6s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none}}

/* ---------- test view ---------- */
.testbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:var(--fs-s)}
.testbar .timer{font-size:1.25rem;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.timer.low{color:var(--amber)} .timer.out{color:var(--red)}
.qcard{background:var(--scope);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qstem{font-family:var(--font-read);font-size:calc(1.18rem * var(--read-scale));line-height:1.55;max-width:70ch;white-space:pre-wrap}
.qctx{font-family:var(--font-read);font-size:calc(1rem * var(--read-scale));line-height:1.6;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--line-2);padding:12px 14px;max-height:45vh;overflow:auto;white-space:pre-wrap;max-width:75ch}
.qsvg{overflow-x:auto;background:#f4f6f5;border-radius:var(--r);padding:8px;max-width:100%}
.qsvg svg{max-width:100%;height:auto;display:block}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;cursor:pointer;min-height:48px;font-family:var(--font-read);font-size:calc(1.02rem * var(--read-scale));line-height:1.4}
.opt:hover{border-color:var(--muted)}
.opt .k{font-family:var(--font-ui);font-weight:700;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:2px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--cyan);background:var(--cyan-bg)}
.opt[aria-pressed="true"] .k{background:var(--cyan);color:var(--bg);border-color:var(--cyan)}
.opt.is-ok{border-color:var(--green);background:var(--green-bg)}
.opt.is-ok .k{background:var(--green);color:var(--bg);border-color:var(--green)}
.opt.is-ko{border-color:var(--red);background:var(--red-bg)}
.opt.is-ko .k{background:var(--red);color:var(--bg);border-color:var(--red)}
.opt .svgopt{background:#f4f6f5;border-radius:2px;padding:4px;display:inline-block;max-width:100%}
.opt .svgopt svg{max-width:100%;height:auto;display:block}
.qnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.qg{position:relative;height:34px;border:1px solid var(--line-2);background:var(--bg);border-radius:2px;cursor:pointer;font-size:var(--fs-xs);font-variant-numeric:tabular-nums;color:var(--muted)}
.qg.ans{background:var(--scope-2);color:var(--fg);border-color:var(--muted)}
.qg.cur{outline:2px solid var(--cyan);outline-offset:1px;color:var(--cyan)}
.qg.flag::after{content:"";position:absolute;top:2px;right:2px;width:0;height:0;border-left:8px solid transparent;border-top:8px solid var(--amber)}
.qg.r-ok{border-color:var(--green);color:var(--green)} .qg.r-ko{border-color:var(--red);color:var(--red)} .qg.r-bl{border-style:dashed}
.feedback{border-top:1px dashed var(--line-2);padding-top:12px}

/* ---------- results ---------- */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:620px){.score{grid-template-columns:1fr}}
.bignum{font-size:var(--fs-xxl);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.02em}
.bignum small{font-size:1rem;color:var(--muted);font-weight:400}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv>div{border:1px solid var(--line);padding:8px 10px;border-radius:2px;background:var(--bg)}
.kv .v{font-size:1.2rem;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:var(--fs-s)}
.bar .track{height:10px;background:var(--bg);border:1px solid var(--line);position:relative;border-radius:1px;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--green)}
.bar .fill.mid{background:var(--amber)} .bar .fill.low{background:var(--red)}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .pc{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar.clickable{cursor:pointer} .bar.clickable:hover .nm{color:var(--cyan)}
@media (max-width:520px){.bar{grid-template-columns:minmax(0,1fr) 80px}.bar .track{grid-column:1 / -1;grid-row:2}}
.review{display:flex;flex-direction:column;gap:12px}
.rv{border:1px solid var(--line);border-left:3px solid var(--dim);background:var(--scope);padding:14px;border-radius:2px;display:flex;flex-direction:column;gap:10px}
.rv.st-ok{border-left-color:var(--green)} .rv.st-ko{border-left-color:var(--red)} .rv.st-bl{border-left-color:var(--dim)}
.rv .stem{font-family:var(--font-read);font-size:calc(1.04rem * var(--read-scale));white-space:pre-wrap}
.ol{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ol li{font-family:var(--font-read);font-size:calc(.95rem * var(--read-scale));display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:6px 8px;border:1px solid transparent;border-radius:2px}
.ol li.c{border-color:rgba(82,214,143,.45);background:var(--green-bg)}
.ol li.w{border-color:rgba(255,106,92,.45);background:var(--red-bg)}
.ol li .why{grid-column:2;color:var(--muted);font-size:calc(.86rem * var(--read-scale))}
.ol li b.k{font-family:var(--font-ui)}
.expl{font-family:var(--font-read);font-size:calc(.98rem * var(--read-scale));line-height:1.6;background:var(--bg);border:1px solid var(--line);padding:10px 12px;border-radius:2px;max-width:80ch}
.expl b{color:var(--green);font-weight:700}
.expl code,.rv code{font-family:var(--font-ui);font-size:.92em;color:var(--cyan)}
.note-dudosa{font-family:var(--font-read);font-size:var(--fs-s);border:1px dashed var(--amber);color:var(--amber);padding:8px 10px;border-radius:2px;background:var(--amber-bg)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:2px}
table.tbl{border-collapse:collapse;width:100%;font-size:var(--fs-s);min-width:560px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--scope-2);font-weight:400}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--scope-2)}

/* bank explorer */
.qitem{border:1px solid var(--line);border-radius:2px;background:var(--bg)}
.qitem>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.qitem>summary::-webkit-details-marker{display:none}
.qitem .s1{font-family:var(--font-read);font-size:var(--fs-s);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}

/* toasts & overlays */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--scope-2);border:1px solid var(--green);color:var(--green);padding:10px 16px;border-radius:var(--r);font-size:var(--fs-s);letter-spacing:.06em;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.toast.err{border-color:var(--red);color:var(--red)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(5,9,11,.82);display:grid;place-items:center;padding:16px}
.dialog{background:var(--scope);border:1px solid var(--line-2);border-radius:var(--r);padding:20px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px}
.lock{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:16px}
.lock .dialog{border-color:var(--amber)}
.empty{border:1px dashed var(--line-2);padding:18px;border-radius:2px;color:var(--muted);font-size:var(--fs-s);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.kbd{font-family:var(--font-ui);border:1px solid var(--line-2);border-bottom-width:2px;padding:0 5px;border-radius:2px;font-size:var(--fs-xs);color:var(--muted)}
.help p,.help li{font-family:var(--font-read);font-size:var(--fs-m);max-width:75ch}
.help code{color:var(--cyan)}
pre.code{background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:2px;overflow-x:auto;font-size:var(--fs-xs);line-height:1.5;margin:0}
.spark{width:100%;height:46px;display:block}

/* figuras (psicotécnicos) */
.qimg{background:#f4f6f5;border-radius:var(--r);padding:8px;max-width:100%;overflow-x:auto}
.qimg img{display:block;max-width:100%;height:auto;margin:0 auto;cursor:zoom-in}
.qimg{position:relative}
.qimg.sol{margin-top:10px;border-left:3px solid var(--green)}
.qimg::after{content:"toca la figura para ampliarla";display:block;text-align:right;margin-top:4px;font:400 10px/1.2 var(--font-ui);letter-spacing:.06em;color:#56635d;pointer-events:none}
.zoomer{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}
.zoomer .zbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line)}
.zoomer .zbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#f4f6f5;padding:8px;touch-action:pan-x pan-y pinch-zoom}
.zoomer .zbody img{display:block;margin:0 auto;height:auto}
.opt .imgopt{background:#f4f6f5;border-radius:2px;padding:4px;display:inline-block;max-width:100%}
.opt .imgopt img{display:block;max-width:100%;max-height:150px;height:auto}
.opts.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
/* opciones cortas (letras de una figura, números): una fila de botones grandes */
.opts.short{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr))}
.opts.short .opt{grid-template-columns:auto auto;justify-content:center;gap:10px;min-height:56px;font-family:var(--font-ui);font-size:calc(1.1rem * var(--read-scale))}
.opts.short .opt .k{width:32px;height:32px}

/* avisos fijos: actualización e instalación */
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--cyan);background:var(--cyan-bg);color:var(--fg);padding:10px 12px;border-radius:var(--r);font-size:var(--fs-s)}
.banner .grow{flex:1 1 220px;min-width:0;font-family:var(--font-read)}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:55;width:min(520px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.5);background:var(--scope-2)}

/* táctil */
button,.opt,.tab,.qg,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@supports (-webkit-touch-callout:none){ .input,select.input,textarea.input{font-size:16px} }

/* mobile tab bar */
@media (max-width:760px){
  /* backdrop-filter crearía un bloque contenedor y la barra fija dejaría de ir abajo */
  .topbar{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,16,19,.97);border-top:1px solid var(--line);padding:0 4px calc(env(safe-area-inset-bottom,0px));max-width:none;justify-content:space-around}
  .tab{flex:1 1 auto;padding:12px 2px;font-size:.66rem;letter-spacing:.03em;border-bottom:none;border-top:2px solid transparent}
  .tab .lg{display:none}
  .tab[aria-current="page"]{border-top-color:var(--green)}
  .status .hide-sm{display:none}
  .qcard{padding:14px}
  .qstem{font-size:calc(1.08rem * var(--read-scale))}
  /* navegación del test siempre a mano (una mano, de pie en el metro) */
  .qnav{position:sticky;bottom:0;z-index:5;margin:0 -14px -14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--scope);border-top:1px solid var(--line);gap:6px}
  .qnav .row{gap:6px}
  .qnav .btn{padding:8px 11px;min-height:44px}
  .updbar{bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
}
.in-test .tabs{display:none}
@media print{.tabs,.topbar{display:none}}
</style>

<script id="builtin-bank" type="application/json">{"formato": "atc-banco", "version": 1, "lote": "Integradas", "preguntas": [{"id": "GEN-ING-001", "modulo": "ingles", "tema": "Inversión y énfasis", "nivel": "C1", "enunciado": "Under no circumstances ___ to enter the runway without a clearance.", "opciones": ["pilots are permitted", "are pilots permitted", "pilots permitted", "permitted are pilots"], "correcta": 1, "explicacion": "Una expresión negativa al inicio (**Under no circumstances**, *Never*, *At no time*…) obliga a la **inversión** auxiliar + sujeto: *are pilots permitted*.", "descartes": ["Orden normal sujeto-verbo: falta la inversión.", null, "Falta el auxiliar *are*.", "Invierte el participio, no el auxiliar."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-002", "modulo": "ingles", "tema": "Condicionales y wish", "nivel": "C1", "enunciado": "If the crew had followed the checklist, the aircraft ___ on the ground now.", "opciones": ["wouldn't be", "wouldn't have been", "won't be", "isn't"], "correcta": 0, "explicacion": "**Condicional mixto**: condición en el pasado (*had followed*) con consecuencia en el presente (*now*) → *would + infinitivo*.", "descartes": [null, "Tercer condicional puro: no encaja con *now*.", "*Will* no se usa en la oración principal de una condición irreal.", "Presente indicativo: no expresa resultado hipotético."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-003", "modulo": "ingles", "tema": "Modales", "nivel": "C1", "enunciado": "The incident report ___ by now; it was due yesterday.", "opciones": ["should have been submitted", "should be submitted", "should have submitted", "should submit"], "correcta": 0, "explicacion": "Obligación no cumplida en el pasado + voz pasiva (el informe *es entregado*): **should have been + participio**.", "descartes": [null, "Presente: no expresa que el plazo ya pasó.", "Activa: el informe no entrega nada; necesita pasiva.", "Presente activo: doble error."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-004", "modulo": "ingles", "tema": "Pasiva y causativa", "nivel": "C1", "enunciado": "The airline ___ by an external contractor last month.", "opciones": ["had its fleet inspected", "had inspected its fleet", "was inspected its fleet", "had its fleet inspect"], "correcta": 0, "explicacion": "**Causativa** *have + objeto + participio*: otro (el contratista) hace la acción para la aerolínea. Encaja con *by an external contractor*.", "descartes": [null, "Pasado perfecto activo: la propia aerolínea inspeccionó; choca con *by…*.", "Pasiva con objeto directo detrás: agramatical.", "Tras el objeto va participio (*inspected*), no infinitivo."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-005", "modulo": "ingles", "tema": "Condicionales y wish", "nivel": "C1", "enunciado": "I wish the controller ___ so fast; I can barely follow the instructions.", "opciones": ["wouldn't speak", "doesn't speak", "hadn't spoken", "won't speak"], "correcta": 0, "explicacion": "**Wish + would** expresa queja por un comportamiento ajeno que nos molesta en el presente.", "descartes": [null, "Tras *wish* no va presente indicativo.", "*Wish + past perfect* lamenta el pasado; aquí la situación es actual (*I can barely follow*).", "*Will* no se usa tras *wish*."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-006", "modulo": "ingles", "tema": "Condicionales y wish", "nivel": "B2", "enunciado": "It's high time the authorities ___ the noise regulations.", "opciones": ["review", "reviewed", "have reviewed", "will review"], "correcta": 1, "explicacion": "**It's (high) time + sujeto + pasado simple** con valor presente: «ya va siendo hora de que…».", "descartes": ["Presente: la estructura exige pasado.", null, "Presente perfecto: no se usa en esta estructura.", "Futuro: no se usa en esta estructura."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-007", "modulo": "ingles", "tema": "Gerundio e infinitivo", "nivel": "C1", "enunciado": "The crew denied ___ the warning light before take-off.", "opciones": ["to see", "having seen", "to have seen", "have seen"], "correcta": 1, "explicacion": "**Deny** va siempre seguido de **-ing** (aquí el gerundio perfecto *having seen*, acción anterior).", "descartes": ["*Deny* no admite infinitivo.", null, "*Deny* no admite infinitivo, tampoco el perfecto.", "Forma verbal sin -ing: agramatical."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-008", "modulo": "ingles", "tema": "Oraciones de relativo", "nivel": "C1", "enunciado": "The runway, ___ resurfacing was completed last week, has reopened.", "opciones": ["which", "whose", "that", "of which"], "correcta": 1, "explicacion": "Posesión (*la repavimentación de la pista*) → **whose** + sustantivo.", "descartes": ["*Which* no expresa posesión delante de un sustantivo.", null, "*That* no se usa en relativas explicativas (entre comas) ni expresa posesión.", "Sería correcto como *the resurfacing of which*, no en este orden."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-009", "modulo": "ingles", "tema": "Conectores", "nivel": "B2", "enunciado": "The flight was delayed ___ a technical fault.", "opciones": ["owing to", "because", "in spite", "due"], "correcta": 0, "explicacion": "**Owing to** (= *because of*, *due to*) va seguido de sustantivo.", "descartes": [null, "*Because* necesita *of* delante de un sustantivo.", "*In spite* necesita *of*, y además indica contraste.", "*Due* necesita *to*."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-010", "modulo": "ingles", "tema": "Vocabulario aeronáutico", "nivel": "B2", "enunciado": "The aircraft had to ___ because a vehicle was still on the runway.", "opciones": ["go around", "take over", "set off", "touch up"], "correcta": 0, "explicacion": "**Go around** (*motor y al aire*): abortar la aproximación y volver a ascender. Término estándar en fraseología.", "descartes": [null, "*Take over* = asumir el control o un cargo.", "*Set off* = salir de viaje / hacer estallar.", "*Touch up* = retocar."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-011", "modulo": "ingles", "tema": "Phrasal verbs", "nivel": "B2", "enunciado": "Due to the strike, the airline had to ___ more than 200 flights.", "opciones": ["call off", "put up", "take in", "let down"], "correcta": 0, "explicacion": "**Call off** = cancelar.", "descartes": [null, "*Put up* = alojar / montar / tolerar (*put up with*).", "*Take in* = engañar / acoger / asimilar.", "*Let down* = decepcionar."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-012", "modulo": "ingles", "tema": "Colocaciones y expresiones", "nivel": "B2", "enunciado": "Passengers are advised to ___ precautions against theft in the terminal.", "opciones": ["take", "make", "do", "have"], "correcta": 0, "explicacion": "La colocación es **take precautions**.", "descartes": [null, "*Make* no forma colocación con *precautions*.", "*Do* no forma colocación con *precautions*.", "*Have* no forma colocación con *precautions*."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-013", "modulo": "ingles", "tema": "Vocabulario", "nivel": "C2", "enunciado": "The new procedures were introduced to ___ the risk of runway incursions.", "opciones": ["mitigate", "militate", "exacerbate", "instigate"], "correcta": 0, "explicacion": "**Mitigate** = atenuar, reducir (un riesgo, un efecto).", "descartes": [null, "*Militate (against)* = obrar en contra de algo; falso amigo frecuente de *mitigate*.", "*Exacerbate* = agravar: sentido contrario.", "*Instigate* = provocar, iniciar."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-014", "modulo": "ingles", "tema": "Vocabulario", "nivel": "B2", "enunciado": "The storm ___ the departure schedule severely.", "opciones": ["affected", "effected", "infected", "afflicted"], "correcta": 0, "explicacion": "**Affect** (verbo) = afectar, influir en.", "descartes": [null, "*Effect* como verbo = llevar a cabo (*effect a change*).", "*Infect* = contagiar.", "*Afflict* = causar sufrimiento a personas."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-015", "modulo": "ingles", "tema": "Formación de palabras", "nivel": "B2", "enunciado": "The ___ of the new radar system took longer than expected.", "opciones": ["implementation", "implementive", "implement", "implemental"], "correcta": 0, "explicacion": "Tras *The ___ of* se necesita un sustantivo: **implementation**.", "descartes": [null, "Palabra inexistente.", "*Implement* aquí sería «herramienta», no «implantación».", "Adjetivo poco usado; aquí falta un sustantivo."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-016", "modulo": "ingles", "tema": "Determinantes y cuantificadores", "nivel": "B2", "enunciado": "The airport has two runways, but ___ of them was usable during the storm, so all flights were diverted.", "opciones": ["neither", "none", "either", "both"], "correcta": 0, "explicacion": "Para **dos** elementos y sentido negativo: **neither** (verbo en singular *was*).", "descartes": [null, "*None* se usa con tres o más.", "*Either* = cualquiera de los dos: contradice *all flights were diverted*.", "*Both* exige verbo en plural y contradice el sentido."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-017", "modulo": "ingles", "tema": "Estilo indirecto", "nivel": "B2", "enunciado": "The tower asked the pilot ___.", "opciones": ["what his intentions were", "what were his intentions", "what are his intentions", "which his intentions were"], "correcta": 0, "explicacion": "En la pregunta indirecta va el **orden de afirmación** (sujeto + verbo) y el tiempo retrocede: *what his intentions were*.", "descartes": [null, "Mantiene el orden de pregunta directa.", "Orden de pregunta directa y sin retroceso temporal.", "*Which* no funciona aquí como pronombre interrogativo."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-018", "modulo": "ingles", "tema": "Modales", "nivel": "C1", "enunciado": "The aircraft ___ landed yet; the runway is still empty.", "opciones": ["can't have", "mustn't have", "shouldn't", "needn't have"], "correcta": 0, "explicacion": "Deducción negativa sobre el pasado: **can't have + participio** («es imposible que haya…»).", "descartes": [null, "*Mustn't have* no se usa para deducción en inglés estándar.", "*Shouldn't* expresa consejo u obligación.", "*Needn't have* = hizo algo innecesario."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-019", "modulo": "ingles", "tema": "Conectores", "nivel": "B2", "enunciado": "___ the strong crosswind, the landing was remarkably smooth.", "opciones": ["Despite", "Although", "However", "In spite"], "correcta": 0, "explicacion": "**Despite** + sustantivo expresa contraste.", "descartes": [null, "*Although* necesita una oración (sujeto + verbo).", "*However* une oraciones y va seguido de coma.", "Falta *of*: *In spite of*."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-020", "modulo": "ingles", "tema": "Conectores", "nivel": "C1", "enunciado": "You may leave early ___ you hand over the position properly.", "opciones": ["provided that", "unless", "in case", "otherwise"], "correcta": 0, "explicacion": "**Provided (that)** = siempre que, con la condición de que.", "descartes": [null, "*Unless* = a menos que: invierte el sentido.", "*In case* = por si acaso.", "*Otherwise* = de lo contrario; no introduce condición."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-021", "modulo": "ingles", "tema": "Gerundio e infinitivo", "nivel": "C1", "enunciado": "The safety board recommended that every controller ___ refresher training annually.", "opciones": ["undergo", "underwent", "will undergo", "to undergo"], "correcta": 0, "explicacion": "Tras *recommend that* se usa el **subjuntivo** (forma base, sin -s): *every controller undergo*. También valdría *should undergo*.", "descartes": [null, "Pasado simple: no se usa en esta estructura.", "*Will* no se usa tras *recommend that*.", "Infinitivo con *to* tras *that*: agramatical."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-022", "modulo": "ingles", "tema": "Inversión y énfasis", "nivel": "C1", "enunciado": "Only after the fog had lifted ___ to take off.", "opciones": ["were we allowed", "we were allowed", "we allowed", "allowed we"], "correcta": 0, "explicacion": "**Only after / Only when / Only then** al inicio provocan **inversión** en la oración principal.", "descartes": [null, "Sin inversión.", "Sin inversión y en activa (sentido erróneo).", "Invierte el verbo principal sin auxiliar."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-023", "modulo": "ingles", "tema": "Condicionales y wish", "nivel": "C1", "enunciado": "I'd rather you ___ the frequency until I finish the briefing.", "opciones": ["didn't use", "don't use", "not use", "won't use"], "correcta": 0, "explicacion": "**Would rather + otro sujeto + pasado simple** para preferencias sobre el presente o futuro.", "descartes": [null, "Presente: no se usa con otro sujeto.", "Forma base: solo con el mismo sujeto (*I'd rather not use*).", "*Will* no se usa en esta estructura."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-024", "modulo": "ingles", "tema": "Pasiva y causativa", "nivel": "C1", "enunciado": "The aircraft ___ to have been carrying 180 passengers.", "opciones": ["is believed", "believes", "is believing", "has believed"], "correcta": 0, "explicacion": "**Pasiva impersonal**: *sujeto + is believed / said / thought + to (have) + participio*.", "descartes": [null, "Activa: el avión no cree nada.", "*Believe* es verbo de estado y aquí debe ir en pasiva.", "Activa: el avión no cree nada."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-025", "modulo": "ingles", "tema": "Idioms", "nivel": "C1", "enunciado": "After the third delay, the passengers' patience was wearing ___.", "opciones": ["thin", "narrow", "slim", "fine"], "correcta": 0, "explicacion": "**Wear thin** = agotarse (la paciencia).", "descartes": [null, "No forma expresión con *wear*.", "No forma expresión con *wear*.", "No forma expresión con *wear*."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-026", "modulo": "ingles", "tema": "Idioms", "nivel": "C1", "enunciado": "Getting a departure slot at that time of day is ___; the airport is completely congested.", "opciones": ["a long shot", "a piece of cake", "a close call", "a far cry"], "correcta": 0, "explicacion": "**A long shot** = algo con muy pocas posibilidades.", "descartes": [null, "*A piece of cake* = algo muy fácil: sentido contrario.", "*A close call* = algo que estuvo a punto de pasar (un susto).", "*A far cry from* = muy distinto de."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-027", "modulo": "ingles", "tema": "Vocabulario aeronáutico", "nivel": "B2", "enunciado": "\"Hold ___ of runway 32R,\" said the controller.", "opciones": ["short", "out", "off", "aside"], "correcta": 0, "explicacion": "**Hold short of** = detenerse antes de la pista o del punto indicado. Fraseología OACI.", "descartes": [null, "*Hold out* = resistir / ofrecer.", "*Hold off* = aplazar / mantener a distancia.", "*Hold aside* no existe en fraseología."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-028", "modulo": "ingles", "tema": "Phrasal verbs", "nivel": "C1", "enunciado": "The two departments have ___ over the new rostering system.", "opciones": ["fallen out", "fallen through", "fallen behind", "fallen for"], "correcta": 0, "explicacion": "**Fall out (with/over)** = pelearse, enemistarse.", "descartes": [null, "*Fall through* = fracasar (planes).", "*Fall behind* = retrasarse.", "*Fall for* = enamorarse de / dejarse engañar."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-029", "modulo": "ingles", "tema": "Phrasal verbs", "nivel": "C1", "enunciado": "The deal to buy two new simulators ___ at the last minute.", "opciones": ["fell through", "fell out", "fell behind", "fell for"], "correcta": 0, "explicacion": "**Fall through** = no llegar a concretarse (un acuerdo, un plan).", "descartes": [null, "*Fall out* = pelearse.", "*Fall behind* = retrasarse.", "*Fall for* = enamorarse de / dejarse engañar."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-030", "modulo": "ingles", "tema": "Tiempos verbales", "nivel": "C1", "enunciado": "By the time the relief controller arrives, I ___ for nine hours straight.", "opciones": ["will have been working", "will work", "am working", "have worked"], "correcta": 0, "explicacion": "Duración hasta un punto futuro (*By the time… arrives*, *for nine hours*) → **futuro perfecto continuo**.", "descartes": [null, "Futuro simple: no expresa duración acumulada.", "Presente continuo: no llega a un punto futuro.", "Presente perfecto: mide hasta ahora, no hasta el futuro."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-031", "modulo": "ingles", "tema": "Tiempos verbales", "nivel": "B2", "enunciado": "This is the first time I ___ a night shift on my own.", "opciones": ["have done", "do", "did", "am doing"], "correcta": 0, "explicacion": "**It's/This is the first time + present perfect**.", "descartes": [null, "Presente simple: no se usa en esta estructura.", "Pasado simple: solo con *It was the first time…* (y entonces *had done*).", "Presente continuo: no se usa en esta estructura."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-032", "modulo": "ingles", "tema": "Comparativos y adjetivos", "nivel": "B2", "enunciado": "The busier the sector gets, ___ the controllers need to be.", "opciones": ["the more alert", "more alert", "the most alert", "the alerter"], "correcta": 0, "explicacion": "Comparativo correlativo: **the + comparativo…, the + comparativo**.", "descartes": [null, "Falta *the*.", "Superlativo: no encaja en la estructura.", "*Alert* forma el comparativo con *more*."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-033", "modulo": "ingles", "tema": "Gerundio e infinitivo", "nivel": "B2", "enunciado": "Controllers working nights soon get used to ___ during the day.", "opciones": ["sleeping", "sleep", "slept", "have slept"], "correcta": 0, "explicacion": "En **get/be used to**, *to* es preposición → va seguido de **-ing**.", "descartes": [null, "Infinitivo: sería *used to sleep* (hábito pasado), otra estructura.", "Participio: agramatical.", "Infinitivo perfecto: agramatical."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-034", "modulo": "ingles", "tema": "Inversión y énfasis", "nivel": "C1", "enunciado": "___ worries me is the lack of experienced staff.", "opciones": ["What", "That", "Which", "It"], "correcta": 0, "explicacion": "**Pseudo-cleft**: *What + verbo… is…* («lo que me preocupa es…»).", "descartes": [null, "*That* no funciona como «lo que».", "*Which* no funciona como «lo que» al inicio.", "Sería *It is the lack… that worries me* (otra estructura)."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-035", "modulo": "ingles", "tema": "Comparativos y adjetivos", "nivel": "B2", "enunciado": "It was ___ turbulent flight that the cabin crew couldn't serve drinks.", "opciones": ["such a", "so a", "so", "such"], "correcta": 0, "explicacion": "**Such + a + adjetivo + sustantivo contable singular** (*such a turbulent flight*).", "descartes": [null, "*So* va con adjetivo solo: *so turbulent*.", "*So turbulent flight* sin artículo es agramatical.", "Falta el artículo *a* con sustantivo contable singular."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-036", "modulo": "ingles", "tema": "Inversión y énfasis", "nivel": "C1", "enunciado": "We had hardly reached cruising altitude ___ the engine warning came on.", "opciones": ["when", "than", "that", "then"], "correcta": 0, "explicacion": "**Hardly / Scarcely… when**; en cambio **No sooner… than**.", "descartes": [null, "*Than* corresponde a *No sooner*.", "*That* no se combina con *hardly*.", "*Then* no es conjunción."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-037", "modulo": "ingles", "tema": "Preposiciones y régimen", "nivel": "B2", "enunciado": "The airline was fined for failing to comply ___ the new regulations.", "opciones": ["with", "to", "by", "on"], "correcta": 0, "explicacion": "El régimen es **comply with**.", "descartes": [null, "Error típico por calco de *conform to*.", "No es el régimen de *comply*.", "No es el régimen de *comply*."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-038", "modulo": "ingles", "tema": "Vocabulario", "nivel": "C1", "enunciado": "Fog is ___ to clear by midday.", "opciones": ["likely", "probable", "possible", "potential"], "correcta": 0, "explicacion": "Solo **likely** admite *sujeto + be likely + to infinitivo*.", "descartes": [null, "*Probable* solo con *It is probable that…*.", "*Possible* solo con *It is possible that…*.", "*Potential* es atributivo (*a potential risk*)."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-039", "modulo": "ingles", "tema": "Colocaciones y expresiones", "nivel": "B2", "enunciado": "The flight was cancelled at short ___.", "opciones": ["notice", "warning", "advice", "note"], "correcta": 0, "explicacion": "Expresión fija **at short notice** = con poca antelación.", "descartes": [null, "No forma la expresión.", "No forma la expresión.", "No forma la expresión."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}, {"id": "GEN-ING-040", "modulo": "ingles", "tema": "Preposiciones y régimen", "nivel": "B2", "enunciado": "Who is ___ the approach sector tonight?", "opciones": ["in charge of", "responsible of", "in control on", "on charge of"], "correcta": 0, "explicacion": "**In charge of** = a cargo de.", "descartes": [null, "Sería *responsible for*.", "Sería *in control of*.", "La preposición correcta es *in* (*in charge of*)."], "origen": "generada", "fuente": "Generada para la app", "lote": "Integradas", "revision": "ok"}]}</script>
<script>
"use strict";

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtRich(s){ // **negrita**, *cursiva*, `código`, saltos de línea
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<i>$2</i>").replace(/`(.+?)`/g, "<code>$1</code>");
  return h.replace(/\n/g, "<br>");
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function uid(p="T"){ return p + "-" + Date.now().toString(36).toUpperCase().slice(-5) + Math.random().toString(36).slice(2,5).toUpperCase(); }
function fmtDate(t){ const d=new Date(t); return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}); }
function fmtDur(ms){ const s=Math.max(0,Math.round(ms/1000)); const m=Math.floor(s/60), r=s%60; return (m<10?"0":"")+m+":"+(r<10?"0":"")+r; }
function fmtN(x,d=2){ return (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pct(a,b){ return b ? Math.round(100*a/b) : 0; }
function toast(msg, err=false){ const t=$("#toast"); t.textContent=msg; t.className="toast"+(err?" err":""); t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 3200); }
function safeImg(src){ return (typeof src === "string" && src.length < 3e6 && /^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(src)) ? src : ""; }
function optsClass(q){ if(hasFigOpts(q)) return "figs"; return q.opciones.every(o=>typeof o==="string" && o.trim().length<=6) ? "short" : ""; }
function hasFigOpts(q){ return q.opciones.some(o=>o && typeof o==="object" && (o.img || o.imgRef || o.svg)); }
function figHTML(q, cls="qimg"){ return q.img && safeImg(q.img) ? `<div class="${cls}"><img src="${safeImg(q.img)}" alt="Figura del enunciado"></div>` : (q.imgRef ? `<div class="dim" style="font-size:var(--fs-xs)">(figura no disponible: la pregunta ya no está en el banco)</div>` : ""); }
function safeSVG(str){
  try{
    const doc = new DOMParser().parseFromString(String(str), "image/svg+xml");
    const svg = doc.documentElement;
    if(!svg || svg.nodeName.toLowerCase()!=="svg" || doc.querySelector("parsererror")) return "";
    const bad = new Set(["script","foreignobject","iframe","image","use","a","style","animate","set"]);
    const clean = n => { [...n.attributes||[]].forEach(a=>{ if(/^on/i.test(a.name) || /href$/i.test(a.name)) n.removeAttribute(a.name); }); [...n.children].forEach(c=>{ if(bad.has(c.nodeName.toLowerCase())) c.remove(); else clean(c); }); };
    clean(svg);
    return new XMLSerializer().serializeToString(svg);
  }catch(e){ return ""; }
}
function canShareFile(f){ try{ return !!(f && navigator.share && navigator.canShare && navigator.canShare({files:[f]})); }catch(e){ return false; } }
function anchorDownload(name, blob){
  try{
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast("Descargado: " + name); return true;
  }catch(e){ return false; }
}
function download(name, text){
  const blob = new Blob([text], {type:"application/json"});
  let file = null; try{ file = new File([blob], name, {type:"application/json"}); }catch(e){}
  if(BUILD.ios || (BUILD.touch && canShareFile(file))){
    // iPhone: la hoja de compartir da «Guardar en Archivos». Se abre desde un toque en este diálogo para que Safari la permita.
    openDialog(`<h2>Archivo listo</h2><p class="read" style="margin:0"><code>${esc(name)}</code> · ${Math.max(1,Math.round(blob.size/1024))} KB</p>
      <p class="read muted" style="margin:0;font-size:var(--fs-s)">Pulsa <b>Guardar / compartir</b> y elige <b>Guardar en Archivos</b>. Si no aparece la opción, prueba <b>Descargar</b> o copia el texto.</p>
      <div class="row"><button class="btn primary" id="dl-share" type="button">Guardar / compartir</button><button class="btn" id="dl-a" type="button">Descargar</button><button class="btn ghost" id="dl-txt" type="button">Ver texto</button><button class="btn ghost" data-close type="button">Cerrar</button></div>
      <div id="dl-err" class="ko" style="font-size:var(--fs-s)"></div>`);
    $("#dl-share").onclick = async () => {
      let f = file;
      if(!canShareFile(f)){ try{ const f2 = new File([text], name, {type:"text/plain"}); if(canShareFile(f2)) f = f2; }catch(e){} }
      if(!canShareFile(f)){ $("#dl-err").textContent = "Este navegador no deja compartir archivos. Usa Descargar o Ver texto."; return; }
      try{ await navigator.share({files:[f], title:name}); closeDialog(); toast("Listo: " + name); }
      catch(e){ if(e && e.name === "AbortError") return; $("#dl-err").textContent = "No se pudo compartir (" + (e && e.name || e) + "). Usa Descargar o Ver texto."; }
    };
    $("#dl-a").onclick = () => anchorDownload(name, blob);
    $("#dl-txt").onclick = () => showText("Copia este contenido y guárdalo como " + name, text);
    return;
  }
  if(!anchorDownload(name, blob)) showText("Copia este contenido y guárdalo como " + name, text);
}

/* ---------------- almacenamiento ---------------- */
const Store = (() => {
  let db = null, mode = "mem"; const mem = {};
  function openDB(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("app-atc",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
  async function init(){
    try{ db = await openDB(); mode="idb"; return mode; }catch(e){}
    try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); mode="ls"; }catch(e){ mode="mem"; }
    return mode;
  }
  function tx(kind, fn){ return new Promise((res,rej)=>{ try{ const t=db.transaction("kv",kind); const s=t.objectStore("kv"); const r=fn(s); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }catch(e){ rej(e); } }); }
  async function get(k){
    try{
      if(mode==="idb") return await tx("readonly", s=>s.get(k)) ?? null;
      if(mode==="ls"){ const v=localStorage.getItem("atc."+k); return v==null?null:JSON.parse(v); }
    }catch(e){ console.warn("get", k, e); }
    return mem[k] ?? null;
  }
  async function set(k,v){
    try{
      if(mode==="idb"){ await tx("readwrite", s=>s.put(v,k)); return true; }
      if(mode==="ls"){ localStorage.setItem("atc."+k, JSON.stringify(v)); return true; }
    }catch(e){ console.warn("set", k, e); toast("No se pudo guardar en el navegador: " + (e.name||e), true); }
    mem[k]=v; return false;
  }
  async function del(k){ try{ if(mode==="idb") await tx("readwrite", s=>s.delete(k)); else if(mode==="ls") localStorage.removeItem("atc."+k); }catch(e){} delete mem[k]; }
  return {init, get, set, del, get mode(){ return mode; }};
})();

/* ---------------- cifrado (AES-GCM + PBKDF2) ---------------- */
const Crypt = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = buf => { let s=""; const b=new Uint8Array(buf); for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const available = () => !!(window.crypto && crypto.subtle && window.isSecureContext !== false);
  async function key(pass, salt){ const base=await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:310000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); }
  async function seal(obj, k, salt){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, enc.encode(JSON.stringify(obj))); return {formato:"atc-cifrado", v:1, salt:b64(salt), iv:b64(iv), ct:b64(ct)}; }
  async function open(box, k){ const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(box.iv)}, k, unb64(box.ct)); return JSON.parse(dec.decode(pt)); }
  return {available, key, seal, open, b64, unb64, newSalt:()=>crypto.getRandomValues(new Uint8Array(16))};
})();

/* El banco importado puede ocupar decenas de MB (figuras): solo se reescribe cuando cambia.
   El progreso se guarda en cada test. Con contraseña, cada parte va cifrada por separado. */
let bankDirty = false;
const VAULT_KEYS = ["vault", "vault_bank", "vault_prog"];
async function persist(opts={}){
  const bank = !!(opts.bank || bankDirty);
  if(S.set.lock && S.vault.key){
    if(bank) await Store.set("vault_bank", await Crypt.seal(S.imported, S.vault.key, S.vault.salt));
    await Store.set("vault_prog", await Crypt.seal(S.prog, S.vault.key, S.vault.salt));
    if(bank){ await Store.del("vault"); await Store.del("imported"); }
    await Store.del("prog");
  }else{
    if(bank) await Store.set("imported", S.imported);
    await Store.set("prog", S.prog);
  }
  if(bank){ bankDirty = false; await Sync.saveSec(); }
}
async function hasVault(){ for(const k of VAULT_KEYS) if(await Store.get(k)) return true; return false; }
async function openVault(pass){
  const legacy = await Store.get("vault");
  if(legacy){ const k=await Crypt.key(pass, Crypt.unb64(legacy.salt)); const d=await Crypt.open(legacy,k); return {k, salt:Crypt.unb64(legacy.salt), imported:d.imported||[], prog:d.prog||defaultsProg(), legacy:true}; }
  const vb = await Store.get("vault_bank"), vp = await Store.get("vault_prog");
  const ref = vp || vb; if(!ref) return null;
  const k = await Crypt.key(pass, Crypt.unb64(ref.salt));
  const prog = vp ? await Crypt.open(vp, k) : defaultsProg();
  const imported = vb ? await Crypt.open(vb, k) : [];
  return {k, salt:Crypt.unb64(ref.salt), imported, prog};
}
async function saveSettings(){ await Store.set("settings", S.set); applySettings(); }
function applySettings(){ document.documentElement.style.setProperty("--read-scale", S.set.readScale||1); $("#btn-lock").hidden = !(S.set.lock && S.vault.key); }

/* ---------------- sincronización entre dispositivos: repositorio PRIVADO de GitHub del usuario ----------------
   Todo se cifra aquí (AES-GCM, clave derivada de la contraseña de sincronización) antes de subirlo: GitHub solo ve datos cifrados.
   Banco importado por lotes (en partes de ~2,5 MB), progreso (tests, repaso, marcas) en un archivo. Fusión a tres bandas con
   el estado de la última sincronización: lo cambiado en un solo lado gana; si cambia en los dos, se unen las preguntas por id. */
const Sync = (() => {
  const API = () => window.ATC_SYNC_API || "https://api.github.com";
  const DIR = "atc", PART = 2500000;
  const enc = new TextEncoder();
  let SEC = null, running = null, soonT = null, keyC = null;
  const status = {t:0, ok:null, msg:""};
  const cfg = () => S.set.sync || null;
  const locked = () => S.set.lock && !S.vault.key;
  const ready = () => !!(cfg() && cfg().on && cfg().repo && SEC && SEC.token && SEC.pass && Crypt.available() && !locked());
  async function sha(s){ const h = await crypto.subtle.digest("SHA-256", enc.encode(s)); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  function httpMsg(s){ return s===401 ? "token no válido o caducado" : s===403 ? "el token no tiene permiso de escritura en el repositorio" : s===404 ? "no encuentro el repositorio (revisa usuario/nombre y que el token tenga acceso a él)" : (s===409||s===422) ? "conflicto: otro dispositivo estaba guardando a la vez" : "GitHub respondió con error " + s; }
  async function gh(method, path, body, accept){
    let r;
    try{ r = await fetch(`${API()}/repos/${cfg().repo}/contents/${path}`, {method, cache:"no-store",
      headers:{"Authorization":"Bearer " + SEC.token, "Accept": accept || "application/vnd.github+json", ...(body ? {"Content-Type":"application/json"} : {})},
      body: body ? JSON.stringify(body) : undefined}); }
    catch(e){ const x = new Error("sin conexión con GitHub"); x.net = true; throw x; }
    if(r.status === 404 && method === "GET") return null;
    if(!r.ok){ const x = new Error(httpMsg(r.status)); x.status = r.status; throw x; }
    return (accept || "").includes("raw") ? r.text() : r.json();
  }
  const raw = name => gh("GET", `${DIR}/${name}`, null, "application/vnd.github.raw+json");
  async function list(){ const a = await gh("GET", DIR); const m = {}; for(const f of (Array.isArray(a) ? a : [])) m[f.name] = f.sha; return m; }
  async function put(dir, name, text){ const r = await gh("PUT", `${DIR}/${name}`, {message:"APP ATC · " + name, content:Crypt.b64(enc.encode(text)), ...(dir[name] ? {sha:dir[name]} : {})}); dir[name] = r && r.content ? r.content.sha : dir[name]; }
  async function del(dir, name){ if(!dir[name]) return; await gh("DELETE", `${DIR}/${name}`, {message:"APP ATC · borrar " + name, sha:dir[name]}); delete dir[name]; }
  async function key(dir){
    const txt = dir["clave.json"] ? await raw("clave.json") : null;
    if(!txt){
      const salt = Crypt.newSalt(), k = await Crypt.key(SEC.pass, salt);
      const c = {formato:"atc-sync", v:1, salt:Crypt.b64(salt), check:await Crypt.seal("atc", k, salt)};
      await put(dir, "clave.json", JSON.stringify(c)); keyC = {pass:SEC.pass, salt:c.salt, k}; return k;
    }
    const c = JSON.parse(txt);
    if(keyC && keyC.pass === SEC.pass && keyC.salt === c.salt) return keyC.k;
    const k = await Crypt.key(SEC.pass, Crypt.unb64(c.salt));
    let good = false; try{ good = (await Crypt.open(c.check, k)) === "atc"; }catch(e){}
    if(!good) throw new Error("la contraseña de sincronización no es la misma que usaste en tu otro dispositivo");
    keyC = {pass:SEC.pass, salt:c.salt, k}; return k;
  }
  const sealT = async (obj, k) => JSON.stringify(await Crypt.seal(obj, k, Crypt.unb64(keyC.salt)));
  const openT = async (name, k) => { const t = await raw(name); if(t == null) throw new Error("falta " + name + " en el repositorio"); return Crypt.open(JSON.parse(t), k); };
  const loteOf = q => q.lote || "sin lote";
  async function localLotes(){
    const g = new Map();
    for(const q of S.imported){ const l = loteOf(q); if(!g.has(l)) g.set(l, []); g.get(l).push(q); }
    const out = {};
    for(const [name, qs] of g){ const s = [...qs].sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0); out[(await sha("lote:" + name)).slice(0,16)] = {name, qs:s, h:await sha(JSON.stringify(s))}; }
    return out;
  }
  function parts(qs){ const out = []; let cur = [], sz = 0; for(const q of qs){ const s = JSON.stringify(q).length; if(cur.length && sz + s > PART){ out.push(cur); cur = []; sz = 0; } cur.push(q); sz += s; } if(cur.length) out.push(cur); return out; }
  const progSig = p => JSON.stringify([(p.attempts||[]).map(a=>a.id).sort(), Object.entries(p.q||{}).map(([id,s])=>[id, s.last||0, s.n||0]).sort(), Object.entries(p.flags||{}).map(([id,f])=>[id, JSON.stringify(f)]).sort()]);
  async function once(){
    const dir = await list();
    const k = await key(dir);
    const idx = dir["indice.json"] ? await openT("indice.json", k) : {lotes:{}, borrados:{}};
    idx.lotes = idx.lotes || {}; idx.borrados = idx.borrados || {};
    const st = (await Store.get("sync_state")) || {base:{}};
    st.base = st.base || {};
    const L = await localLotes();
    if(!Object.keys(L).length && Object.keys(st.base).length) st.base = {};   // banco local vacío: nunca se interpreta como «borra todo en la nube»
    let bankCh = false, idxCh = false, up = 0, down = 0, gone = 0;
    const push = async (fid, l) => {
      const ps = parts(l.qs);
      for(let i = 0; i < ps.length; i++) await put(dir, `b_${fid}_${i}.json`, await sealT(ps[i], k));
      for(const n of Object.keys(dir)){ const m = n.match(/^b_([0-9a-f]{16})_(\d+)\.json$/); if(m && m[1] === fid && +m[2] >= ps.length) await del(dir, n); }
      idx.lotes[fid] = {name:l.name, h:l.h, parts:ps.length, n:l.qs.length, t:Date.now()}; delete idx.borrados[fid]; st.base[fid] = l.h; idxCh = true; up++;
    };
    const pull = async (fid, R) => {
      let qs = []; for(let i = 0; i < R.parts; i++) qs = qs.concat(await openT(`b_${fid}_${i}.json`, k));
      S.imported = S.imported.filter(q=>loteOf(q) !== R.name).concat(qs); st.base[fid] = R.h; bankCh = true; down++;
    };
    const remoteDel = async fid => { for(const n of Object.keys(dir)) if(n.startsWith(`b_${fid}_`)) await del(dir, n); delete idx.lotes[fid]; idx.borrados[fid] = Date.now(); delete st.base[fid]; idxCh = true; gone++; };
    for(const fid of new Set([...Object.keys(L), ...Object.keys(idx.lotes), ...Object.keys(st.base)])){
      const l = L[fid], R = idx.lotes[fid], B = st.base[fid];
      if(l && R){
        if(l.h === R.h){ st.base[fid] = l.h; continue; }
        if(R.h === B) await push(fid, l);
        else if(l.h === B) await pull(fid, R);
        else { await pull(fid, R); const ids = new Set(l.qs.map(q=>q.id)); S.imported = S.imported.filter(q=>loteOf(q) !== l.name || !ids.has(q.id)).concat(l.qs); await push(fid, (await localLotes())[fid]); }
      } else if(l){
        if(B && B === l.h && idx.borrados[fid]){ S.imported = S.imported.filter(q=>loteOf(q) !== l.name); delete st.base[fid]; bankCh = true; gone++; }
        else await push(fid, l);
      } else if(R){
        if(B && R.h === B) await remoteDel(fid); else await pull(fid, R);
      } else delete st.base[fid];
    }
    // progreso
    const rp = dir["progreso.json"] ? await openT("progreso.json", k) : null;
    const progCh = rp ? mergeProg(rp) > 0 : false;
    let progUp = false;
    if(!rp || progSig(rp) !== progSig(S.prog)){ await put(dir, "progreso.json", await sealT(S.prog, k)); progUp = true; }
    if(idxCh) await put(dir, "indice.json", await sealT(idx, k));
    if(bankCh) rebuildIndex();
    if(bankCh || progCh) await persist({bank:bankCh});
    st.last = Date.now(); await Store.set("sync_state", st);
    if((bankCh || progCh) && ["home","stats","bank","review","new"].includes(S.view)) go(S.view);
    const bits = [];
    if(up) bits.push(`${up} lote${up>1?"s":""} subido${up>1?"s":""}`);
    if(down) bits.push(`${down} lote${down>1?"s":""} descargado${down>1?"s":""}`);
    if(gone) bits.push(`${gone} lote${gone>1?"s":""} borrado${gone>1?"s":""}`);
    if(progCh) bits.push("progreso de otro dispositivo añadido");
    if(progUp) bits.push("progreso subido");
    return bits.length ? bits.join(" · ") : "todo al día";
  }
  function setStatus(ok, msg){
    status.ok = ok; status.msg = msg; if(ok !== null) status.t = Date.now();
    const c = $("#st-store"); if(c && cfg() && cfg().on){ c.textContent = ok === null ? "SYNC …" : ok ? "SYNC ✓" : "SYNC !"; c.title = msg; }
    const s = $("#sy-st"); if(s) s.innerHTML = statusHTML();
  }
  function statusHTML(){
    if(!status.msg) return "Aún no se ha sincronizado en esta sesión.";
    const when = status.t ? new Date(status.t).toLocaleTimeString("es-ES", {hour:"2-digit", minute:"2-digit"}) : "";
    return status.ok === null ? `<span class="sel">Sincronizando…</span>` : status.ok ? `<span class="ok">✓ ${when}</span> · ${esc(status.msg)}` : `<span class="ko">✗ ${when}</span> · ${esc(status.msg)}`;
  }
  async function run(manual){
    if(!ready()){ if(manual) toast("La sincronización no está activada", true); return false; }
    if(S.test && !S.test.ended){ soon(60000); return false; }
    if(running) return running;
    running = (async () => {
      setStatus(null, "sincronizando…");
      for(let i = 0; i < 2; i++){
        try{ const msg = await once(); setStatus(true, msg); if(manual) toast("Sincronizado: " + msg); return true; }
        catch(e){
          if((e.status === 409 || e.status === 422) && i === 0) continue;
          setStatus(false, e.message || String(e)); if(manual) toast("Sincronización: " + (e.message || e), true);
          if(e.net) soon(120000);
          return false;
        }
      }
      return false;
    })().finally(() => { running = null; });
    return running;
  }
  function soon(ms){ if(!ready()) return; clearTimeout(soonT); soonT = setTimeout(() => run(false), ms == null ? 2500 : ms); }
  async function load(){
    SEC = null; keyC = null;
    if(S.set.lock && S.vault.key){
      const b = await Store.get("vault_sync");
      if(b){ try{ SEC = await Crypt.open(b, S.vault.key); }catch(e){ SEC = null; } }
      else { SEC = await Store.get("sync_sec"); if(SEC) await saveSec(); }
    } else if(!S.set.lock) SEC = await Store.get("sync_sec");
    const c = $("#st-store"); if(c && cfg() && cfg().on && SEC){ c.textContent = "SYNC"; c.title = "Sincronización activada"; }
  }
  async function saveSec(){
    if(S.set.lock && S.vault.key){ if(SEC) await Store.set("vault_sync", await Crypt.seal(SEC, S.vault.key, S.vault.salt)); else await Store.del("vault_sync"); await Store.del("sync_sec"); }
    else if(!S.set.lock){ if(SEC) await Store.set("sync_sec", SEC); else await Store.del("sync_sec"); await Store.del("vault_sync"); }
  }
  async function activate(repo, token, pass){
    const prev = {set:S.set.sync, sec:SEC};
    S.set.sync = {repo, on:true}; SEC = {token, pass}; keyC = null;
    await Store.del("sync_state");
    const ok = await run(false);
    if(!ok){ S.set.sync = prev.set; SEC = prev.sec; const c = $("#st-store"); if(c && !(prev.set && prev.set.on)){ c.textContent = "LOCAL"; c.title = ""; } return {ok:false, msg:status.msg}; }
    await saveSettings(); await saveSec();
    return {ok:true, msg:status.msg};
  }
  async function disable(){ S.set.sync = null; SEC = null; keyC = null; status.ok = null; status.msg = ""; await saveSettings(); await saveSec(); await Store.del("sync_state"); const c = $("#st-store"); if(c){ c.textContent = "LOCAL"; c.title = ""; } }
  function forget(){ SEC = null; keyC = null; clearTimeout(soonT); }
  const on = () => !!(cfg() && cfg().on && SEC);
  return {run, soon, load, saveSec, activate, disable, forget, on, statusHTML, get last(){ return status.t; }, get repo(){ return cfg() ? cfg().repo : ""; }};
})();

/* une el progreso de otro dispositivo (tests por id; por pregunta gana lo más reciente; marcas por fecha) */
function mergeProg(P){
  let n = 0;
  const ids = new Set(S.prog.attempts.map(a=>a.id));
  for(const a of (P.attempts || [])) if(!ids.has(a.id)){ S.prog.attempts.push(a); n++; }
  S.prog.attempts.sort((a,b)=>a.fecha-b.fecha);
  for(const [id,s] of Object.entries(P.q || {})){ const m = S.prog.q[id]; if(!m || (s.last||0) > (m.last||0)){ S.prog.q[id] = s; n++; } }
  for(const [id,f] of Object.entries(P.flags || {})){ const m = S.prog.flags[id]; if(!m || (f.t||0) > (m.t||0)){ if(JSON.stringify(m) !== JSON.stringify(f)){ S.prog.flags[id] = f; n++; } } }
  return n;
}

/* ---------------- validación e importación ---------------- */
const VALID_MOD = Object.keys(MODS);
function normQ(raw, i, errs, warns){
  const where = `#${i+1}${raw && raw.id ? " ("+raw.id+")" : ""}`;
  if(!raw || typeof raw!=="object"){ errs.push(where+": no es un objeto"); return null; }
  const q = {...raw};
  if(typeof q.id!=="string" || !q.id.trim()){ errs.push(where+": falta 'id'"); return null; }
  q.id = q.id.trim();
  if(!VALID_MOD.includes(q.modulo)){ errs.push(where+": 'modulo' debe ser ingles, psicotecnicos o teoria"); return null; }
  if((typeof q.enunciado!=="string" || !q.enunciado.trim()) && !q.svg && !q.img){ errs.push(where+": falta 'enunciado'"); return null; }
  if(q.img && !safeImg(q.img)){ warns.push(where+": 'img' debe ser una imagen incrustada (data:image/…;base64); se ignora"); delete q.img; }
  if(q.img_sol && !safeImg(q.img_sol)){ warns.push(where+": 'img_sol' debe ser una imagen incrustada (data:image/…;base64); se ignora"); delete q.img_sol; }
  if(q.clave_academia && !q.clave_original) q.clave_original = q.clave_academia; delete q.clave_academia;
  if(!Array.isArray(q.opciones) || q.opciones.length<2 || q.opciones.length>6){ errs.push(where+": 'opciones' debe tener entre 2 y 6 elementos"); return null; }
  for(const o of q.opciones){ if(!(typeof o==="string" || (o && typeof o==="object" && (o.texto||o.svg||(o.img&&safeImg(o.img)))))){ errs.push(where+": opción no válida"); return null; } }
  if(!Number.isInteger(q.correcta) || q.correcta<0 || q.correcta>=q.opciones.length){ errs.push(where+": 'correcta' debe ser el índice (0 = A) de una opción existente"); return null; }
  if(!["archivo","generada"].includes(q.origen)){ warns.push(where+": 'origen' no indicado; se asume 'archivo'"); q.origen="archivo"; }
  if(!q.tema) q.tema = "General";
  if(!q.explicacion) warns.push(where+": sin explicación");
  if(q.revision!=="dudosa") q.revision="ok";
  if(q.descartes && (!Array.isArray(q.descartes) || q.descartes.length!==q.opciones.length)){ warns.push(where+": 'descartes' no coincide con las opciones; se ignora"); delete q.descartes; }
  return q;
}
function parseBank(text){
  let data; const errs=[], warns=[];
  try{ data = JSON.parse(text); }catch(e){ return {ok:false, errs:["El texto no es JSON válido: "+e.message], warns, qs:[]}; }
  if(data && data.formato==="atc-cifrado") return {ok:false, encrypted:true, data, errs:[], warns, qs:[]};
  let list = Array.isArray(data) ? data : (data && Array.isArray(data.preguntas) ? data.preguntas : null);
  if(!list) return {ok:false, errs:["No encuentro la lista de preguntas. Debe ser un array o un objeto con 'preguntas'."], warns, qs:[]};
  const qs=[], seen=new Set();
  list.forEach((r,i)=>{ const q=normQ(r,i,errs,warns); if(q){ if(seen.has(q.id)) errs.push(`#${i+1}: id duplicado dentro del archivo (${q.id})`); else { seen.add(q.id); qs.push(q); } } });
  return {ok:qs.length>0, errs, warns, qs, meta: Array.isArray(data)?{}:{nombre:data.nombre, version:data.version, fecha:data.fecha}};
}
async function importQs(qs){
  const idx = new Map(S.imported.map((q,i)=>[q.id,i])); let nuevas=0, act=0, sobre=0;
  for(const q of qs){
    if(idx.has(q.id)){ S.imported[idx.get(q.id)] = q; act++; }
    else { if(S.builtin.some(b=>b.id===q.id)) sobre++; S.imported.push(q); idx.set(q.id, S.imported.length-1); nuevas++; }
  }
  rebuildIndex(); await persist({bank:true}); Sync.soon();
  return {nuevas, act, sobre};
}

/* ---------------- motor de test ---------------- */
function qStat(id){ return S.prog.q[id] || null; }
function isDue(id, now=Date.now()){ const s=qStat(id); return !!(s && s.box>=1 && s.box<=5 && s.due<=now); }
function dueList(mod){ const now=Date.now(); return allQ().filter(q=>(!mod||q.modulo===mod) && isDue(q.id,now) && S.byId.has(q.id)); }
function pendingFails(mod){ return allQ().filter(q=>(!mod||q.modulo===mod) && (S.prog.q[q.id]?.box>=1 && S.prog.q[q.id]?.box<=5)); }
function refersToPositions(q){ return q.fijarOrden || q.opciones.some(o=>typeof o==="string" && /\b(all (of the )?(above|correct)|both|none of|neither|a and b|b and c|todas|ninguna|ambas|all are)\b/i.test(o)); }

function buildPool(cfg){
  let pool = allQ().filter(q=>q.modulo===cfg.mod);
  if(cfg.origen!=="todas") pool = pool.filter(q=>q.origen===cfg.origen);
  if(cfg.temas && cfg.temas.length) pool = pool.filter(q=>cfg.temas.includes(q.tema));
  if(!cfg.dudosas) pool = pool.filter(q=>q.revision!=="dudosa" && !S.prog.flags[q.id]?.dudosa);
  if(cfg.modo==="repaso") pool = pool.filter(q=>isDue(q.id));
  if(cfg.modo==="fallos") pool = pool.filter(q=>(S.prog.q[q.id]?.ko||0)+(S.prog.q[q.id]?.bl||0)>0);
  if(cfg.modo==="nuevas") pool = pool.filter(q=>!S.prog.q[q.id]);
  return pool;
}
function pickQuestions(cfg){
  let pool = buildPool(cfg);
  if(cfg.modo==="normal"){ // prioriza no vistas y falladas, sin repetir lo recién visto
    const now=Date.now();
    pool = shuffle(pool).map(q=>{ const s=S.prog.q[q.id]; let w=Math.random(); if(!s) w+=1.2; else { if(s.lastOk===false) w+=0.9; if(now-(s.last||0)<DAY) w-=0.8; } return {q,w}; }).sort((a,b)=>b.w-a.w).map(x=>x.q);
  }else pool = shuffle(pool);
  return pool.slice(0, cfg.n);
}
function startTest(cfg){
  const qs = pickQuestions(cfg);
  if(!qs.length){ toast("No hay preguntas que cumplan esos filtros", true); return; }
  const items = qs.map(q=>{
    const n=q.opciones.length; let perm=[...Array(n).keys()];
    if(cfg.shuffle && !refersToPositions(q)) perm = shuffle(perm);
    return {id:q.id, perm, ans:null, flag:false, t:0};
  });
  S.test = {id:uid("TST"), cfg, items, cur:0, start:Date.now(), qStart:Date.now(), ended:false, reveal:{}};
  document.body.classList.add("in-test");
  go("test");
}
function curItem(){ return S.test.items[S.test.cur]; }
function trackTime(){ const T=S.test; if(!T || T.hiddenAt) return; const it=T.items[T.cur]; const now=Date.now(); it.t += Math.max(0, now-T.qStart); T.qStart=now; }
function snapOf(q){ // copia de la pregunta para el historial; las imágenes se referencian (se recuperan del banco al revisar)
  const opciones = q.opciones.map(o => (o && typeof o==="object" && o.img) ? {texto:o.texto, svg:o.svg, imgRef:true} : o);
  return {enunciado:q.enunciado, contexto:q.contexto, svg:q.svg, imgRef:q.img?true:undefined, imgSolRef:q.img_sol?true:undefined, opciones, correcta:q.correcta, explicacion:q.explicacion, descartes:q.descartes, tema:q.tema, origen:q.origen, fuente:q.fuente, revision:q.revision, nota_revision:q.nota_revision, nivel:q.nivel, clave_original:q.clave_original};
}
function hydrate(id, snap){
  if(!snap.imgRef && !snap.imgSolRef && !snap.opciones.some(o=>o && o.imgRef)) return snap;
  const live = S.byId.get(id);
  return {...snap, img: snap.imgRef && live ? live.img : undefined, imgRef: snap.imgRef && !(live && live.img),
    img_sol: snap.imgSolRef && live ? live.img_sol : undefined,
    opciones: snap.opciones.map((o,i)=> o && o.imgRef ? (live && live.opciones[i] && live.opciones[i].img ? {...o, img:live.opciones[i].img, imgRef:false} : o) : o)};
}
function scoreItems(items, penal){
  let ok=0, ko=0, bl=0;
  for(const it of items){ const q=S.byId.get(it.id) || it.snap; if(it.ans==null) bl++; else if(it.ans===q.correcta) ok++; else ko++; }
  const n=items.length, net=ok-ko*penal; return {n, ok, ko, bl, net, nota: n? net*10/n : 0};
}
async function finishTest(reason){
  const T=S.test; if(!T || T.ended) return; trackTime(); T.ended=true; clearInterval(timerH);
  const penal = T.cfg.penal;
  const sc = scoreItems(T.items, penal);
  const now = Date.now();
  const att = {id:T.id, fecha:now, mod:T.cfg.mod, modo:T.cfg.modo, cfg:T.cfg, dur:now-T.start, motivo:reason||"fin",
    items:T.items.map(it=>{ const q=S.byId.get(it.id); return {id:it.id, ans:it.ans, perm:it.perm, flag:it.flag, t:it.t, c:q.correcta, tema:q.tema, snap:snapOf(q)}; }),
    sc};
  // estadísticas por pregunta + repetición espaciada (cajas 1–5; 6 = dominada)
  for(const it of T.items){
    const q=S.byId.get(it.id); const s=S.prog.q[it.id] || {n:0, ok:0, ko:0, bl:0, box:0, due:0, last:0};
    s.n++; s.last=now;
    const right = it.ans!=null && it.ans===q.correcta;
    if(it.ans==null) s.bl++; else if(right) s.ok++; else s.ko++;
    s.lastOk = right; s.lastAns = it.ans;
    if(!right){ s.box=1; s.due=now + DAY*SRS_INT[1]; }
    else if(s.box>=1){ s.box = s.box+1; s.due = s.box<=5 ? now + DAY*SRS_INT[s.box] : 0; }
    S.prog.q[it.id]=s;
  }
  S.prog.attempts.push(att);
  await persist(); await Store.del("cur");
  document.body.classList.remove("in-test");
  S.lastResultId = att.id; S.test = null; Sync.soon(1500);
  if(reason==="tiempo") toast("Tiempo agotado: test finalizado");
  go("result");
}

function modStats(mod){

  const atts = S.prog.attempts.filter(a=>a.mod===mod);
