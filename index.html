const RADAR_GROUPS = {
  ingles:        [["GRAM","Gramática"],["VOCAB","Vocabulario"],["IDIOMS","Idioms y phrasal verbs"],["CONECT","Conectores y preposiciones"]],
  psicotecnicos: [["VERBAL","Verbal"],["NUM","Numérico y series"],["ABSTR","Abstracto y lógico"],["ESPAC","Espacial"],["ATENC","Atención"]],
  teoria:        [1,2,3,4,5,6,7,8,9].map(i=>["T"+i,"Tema "+i])
};
const RADAR_COL = {ingles:"var(--cyan)", psicotecnicos:"var(--amber)", teoria:"var(--green)"};
function radarGroup(mod, tema){
  const t=(tema||"").toLowerCase();
  if(mod==="ingles") return /idiom|phrasal/.test(t)?2 : /conector|preposic/.test(t)?3 : /vocab|formaci|coloca|expresi/.test(t)?1 : 0;
  if(mod==="psicotecnicos") return /atenci|fatiga|conteo|comparaci/.test(t)?4 : /espacial|cubo|pieza/.test(t)?3 : /verbal|ortograf|vocabul|sin[oó]nim/.test(t)?0 : /abstract|l[oó]gic/.test(t)?2 : 1;
  if(mod==="teoria"){ const m=t.match(/^t\s?(\d)\b/)||t.match(/tema\s*(\d)/); return m && +m[1]>=1 && +m[1]<=9 ? +m[1]-1 : -1; }
  return -1;
}
function radarData(){
  const G=[];
  for(const mod of ["ingles","psicotecnicos","teoria"]) RADAR_GROUPS[mod].forEach(([k,name])=>G.push({mod,k,name,temas:new Set(),total:0,n:0,ok:0}));
  const idx={}; let o=0; for(const mod of ["ingles","psicotecnicos","teoria"]){ idx[mod]=o; o+=RADAR_GROUPS[mod].length; }
  for(const q of allQ()){ const g=radarGroup(q.modulo,q.tema); if(g<0||idx[q.modulo]==null) continue; const G1=G[idx[q.modulo]+g]; G1.total++; G1.temas.add(q.tema); const s=S.prog.q[q.id]; if(s){ G1.n+=s.n; G1.ok+=s.ok; } }
  return G;
}
function radarSVG(G){
  // 18 ecos fijos: 4 bloques de inglés, 5 de psicotécnicos y los 9 temas de teoría. Ángulo fijo por bloque; distancia al centro = % de fallo (más lejos = peor).
  G = G || radarData();
  const cx=150, cy=150, R=104, r0=12, N=G.length, step=2*Math.PI/N;
  const rad = acc => r0 + (1-acc)*(R-r0-6);
  const ang = i => -Math.PI/2 + (i+.5)*step;
  const P = (a,r)=>[cx+Math.cos(a)*r, cy+Math.sin(a)*r];
  const f = v=>v.toFixed(1);
  const mono = 'font-family="B612 Mono, monospace"';
  // arcos de sector por módulo y divisores
  let sect="", start=0;
  for(const mod of ["ingles","psicotecnicos","teoria"]){
    const cnt=G.filter(g=>g.mod===mod).length, a0=-Math.PI/2+start*step+.03, a1=-Math.PI/2+(start+cnt)*step-.03;
    const [x0,y0]=P(a0,R+3), [x1,y1]=P(a1,R+3), [dx,dy]=P(-Math.PI/2+start*step,R);
    sect += `<path d="M${f(x0)},${f(y0)} A${R+3},${R+3} 0 ${a1-a0>Math.PI?1:0},1 ${f(x1)},${f(y1)}" fill="none" stroke="${RADAR_COL[mod]}" stroke-width="2" opacity=".75"></path><line x1="${cx}" y1="${cy}" x2="${f(dx)}" y2="${f(dy)}" stroke="var(--line-2)"></line>`;
    start+=cnt; }
  const spokes = G.map((g,i)=>{ const [x,y]=P(ang(i),R); return `<line x1="${cx}" y1="${cy}" x2="${f(x)}" y2="${f(y)}" stroke="var(--line)" stroke-dasharray="1 4"></line>`; }).join("");
  const blips = G.map((g,i)=>{
    const a=ang(i), has=g.n>0, acc=has?g.ok/g.n:0, r=has?rad(acc):R-4, [x,y]=P(a,r);
    const col = !has?"var(--dim)":acc>=.8?"var(--green)":acc>=.6?"var(--amber)":"var(--red)";
    const [lx,ly]=P(a,R+12), c=Math.cos(a), anchor = c>.35?"start":c<-.35?"end":"middle", dy = Math.sin(a)>.5?7:Math.sin(a)<-.5?-4:2;
    const tip = `${g.name}${g.mod==="teoria"&&g.temas.size?" · "+[...g.temas][0].replace(/^T\d+\s*·\s*/,""):""}: ${has?pct(g.ok,g.n)+"% de acierto ("+g.n+" respuestas)":"sin respuestas todavía"}`;
    const mark = has ? `<rect x="${f(x-3)}" y="${f(y-3)}" width="6" height="6" fill="${col}"></rect>` : `<rect x="${f(x-2.5)}" y="${f(y-2.5)}" width="5" height="5" fill="none" stroke="var(--dim)"></rect>`;
    return `<g><title>${esc(tip)}</title>${mark}<text x="${f(lx)}" y="${f(ly+dy)}" text-anchor="${anchor}" ${mono} font-size="7.5"><tspan fill="${RADAR_COL[g.mod]}">${g.k}</tspan>${has?`<tspan fill="var(--muted)"> ${pct(g.ok,g.n)}</tspan>`:""}</text></g>`; }).join("");
  const rings = [.8,.6,.4,.2].map(v=>`<circle cx="${cx}" cy="${cy}" r="${f(rad(v))}" fill="none" stroke="var(--line)" stroke-dasharray="2 3"></circle><text x="${cx+3}" y="${f(cy-rad(v)-2)}" fill="var(--dim)" font-size="6.5" ${mono}>${v*100}%</text>`).join("");
  return `<svg class="radar" viewBox="-22 -6 344 312" role="img" aria-label="Radar de progreso: 4 bloques de inglés, 5 de psicotécnicos y 9 temas de teoría; cuanto más lejos del centro, más fallos">
    <defs><radialGradient id="sw" cx="0" cy="0" r="1"><stop offset="0" stop-color="var(--green)" stop-opacity=".0"/><stop offset="1" stop-color="var(--green)" stop-opacity=".22"/></radialGradient></defs>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--bg)" stroke="var(--line-2)"></circle>
    ${spokes}${rings}${sect}
    <g><path d="M${cx},${cy} L${cx},${cy-R} A${R},${R} 0 0,1 ${f(cx+R*Math.sin(Math.PI/5))},${f(cy-R*Math.cos(Math.PI/5))} Z" fill="url(#sw)"></path>${reduceMotion()?"":`<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="6s" repeatCount="indefinite"/>`}</g>
    ${blips}
  </svg>`;
}
function reduceMotion(){ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }
function radarPriorities(G){
  const w = G.filter(g=>g.n>=5).sort((a,b)=>a.ok/a.n-b.ok/b.n).slice(0,3);

function renderOpt(o){ if(typeof o==="string") return `<span>${fmtRich(o)}</span>`; const im = o.img && safeImg(o.img); return `<span>${o.svg?`<span class="svgopt">${safeSVG(o.svg)}</span>`:""}${im?`<span class="imgopt"><img src="${im}" alt="Figura de la opción"></span>`:o.imgRef?`<span class="dim">(figura)</span>`:""}${o.texto?fmtRich(o.texto):""}</span>`; }
function vTest(el){
  const T=S.test; if(!T){ go("home"); return; }
  const it=curItem(), q=S.byId.get(it.id), N=T.items.length;
  const answered = T.items.filter(x=>x.ans!=null).length, flagged=T.items.filter(x=>x.flag).length;
  const shown = T.cfg.inmediata && T.reveal[T.cur];
  el.innerHTML = `
  <div class="panel testbar">
    <span class="chip sel">${MODS[T.cfg.mod].cs}</span><span class="tab-num">Q ${String(T.cur+1).padStart(2,"0")}/${N}</span>
    <span class="dim tab-num">RESP ${answered} · MARC ${flagged}</span>
    <span style="margin-left:auto" class="timer mono" id="timer">--:--</span>
    <button class="btn sm danger" id="t-end" type="button">Finalizar</button>
  </div>
  <article class="qcard" aria-live="polite">
    <div class="qmeta"><span class="label">${esc(q.tema)}</span>${q.nivel?`<span class="chip">${esc(q.nivel)}</span>`:""}<span class="chip ${q.origen==="archivo"?"warn":"sel"}">${q.origen==="archivo"?"Archivo":"Generada"}</span>${q.revision==="dudosa"?`<span class="chip ko">Dudosa</span>`:""}</div>
    ${q.contexto?`<div class="qctx">${fmtRich(q.contexto)}</div>`:""}
    ${q.svg?`<div class="qsvg">${safeSVG(q.svg)}</div>`:""}${figHTML(q)}
    <div class="qstem">${fmtRich(q.enunciado||"")}</div>
    <div class="opts ${optsClass(q)}" role="group" aria-label="Opciones">
      ${it.perm.map((oi,pos)=>{ let cls=""; if(shown){ if(oi===q.correcta) cls="is-ok"; else if(it.ans===oi) cls="is-ko"; }
        return `<button class="opt ${cls}" type="button" data-oi="${oi}" aria-pressed="${it.ans===oi}" ${shown?"disabled":""}><span class="k">${LETTERS[pos]}</span>${renderOpt(q.opciones[oi])}</button>`; }).join("")}
    </div>
    ${shown?`<div class="feedback">${explBlock(q, it.ans, it.perm)}</div>`:""}
    <div class="qnav">
      <div class="row"><button class="btn" id="t-prev" type="button" ${T.cur===0?"disabled":""}>◀ Ant.</button><button class="btn" id="t-next" type="button">${T.cur===N-1?"Revisar":"Sig. ▶"}</button></div>
      <div class="row"><button class="btn ${it.flag?"amber":""}" id="t-flag" type="button">${it.flag?"Marcada":"Marcar"}</button><button class="btn ghost" id="t-clear" type="button" ${it.ans==null||shown?"disabled":""}>En blanco</button>
      ${T.cfg.inmediata && !shown ? `<button class="btn primary" id="t-check" type="button" ${it.ans==null?"disabled":""}>Comprobar</button>`:""}</div>
    </div>
  </article>
  <div class="panel"><div class="panel-h"><span class="label">Mapa del test</span><span class="dim" style="font-size:var(--fs-xs)">Relleno = respondida · triángulo = marcada</span></div>
    <div class="qgrid">${T.items.map((x,i)=>`<button type="button" class="qg ${x.ans!=null?"ans":""} ${x.flag?"flag":""} ${i===T.cur?"cur":""}" data-i="${i}" aria-label="Pregunta ${i+1}">${i+1}</button>`).join("")}</div>
  </div>`;
  $$(".opt",el).forEach(b=>b.onclick=()=>{ if(shown) return; const oi=Number(b.dataset.oi); it.ans = it.ans===oi ? null : oi; vTest(el); });
  $("#t-prev",el).onclick=()=>moveTo(T.cur-1);
  $("#t-next",el).onclick=()=>{ if(T.cur===N-1) askFinish(); else moveTo(T.cur+1); };
  $("#t-flag",el).onclick=()=>{ it.flag=!it.flag; vTest(el); };
  $("#t-clear",el).onclick=()=>{ it.ans=null; vTest(el); };
  const ck=$("#t-check",el); if(ck) ck.onclick=()=>{ T.reveal[T.cur]=true; vTest(el); };
  $("#t-end",el).onclick=askFinish;
  $$(".qg",el).forEach(b=>b.onclick=()=>moveTo(Number(b.dataset.i)));
  wireSwipe($(".qcard",el));
  tickTimer(); saveCurSoon();
}
function wireSwipe(card){ // deslizar a la izquierda = siguiente, a la derecha = anterior
  if(!card) return; let x0=null, y0=0, t0=0;
  card.addEventListener("touchstart", e=>{ if(e.touches.length!==1 || e.target.closest(".qsvg,.qimg,.tbl-wrap,textarea,input")){ x0=null; return; } x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); }, {passive:true});
  card.addEventListener("touchend", e=>{ if(x0==null || !S.test) return; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(Date.now()-t0>700 || Math.abs(dx)<70 || Math.abs(dy)>Math.abs(dx)*0.6) return;
    moveTo(S.test.cur + (dx<0?1:-1)); }, {passive:true});
}

/* ---------------- figuras ampliables (móvil) ---------------- */
function openZoom(src){
  if(!src) return;
  const z=document.createElement("div"); z.className="zoomer"; z.setAttribute("role","dialog"); z.setAttribute("aria-label","Figura ampliada");
  z.innerHTML=`<div class="zbar"><span class="label">Figura ampliada</span><div class="row"><button class="btn sm" data-z="fit" type="button">Ajustar</button><button class="btn sm" data-z="big" type="button">Ampliar ×2</button><button class="btn sm primary" data-zc="1" type="button">Cerrar</button></div></div><div class="zbody"><img alt="Figura ampliada"></div>`;
  const im=z.querySelector("img"); im.src=src;
  const fit=()=>{ im.style.width="100%"; im.style.maxWidth="100%"; };
  const big=()=>{ im.style.maxWidth="none"; im.style.width=Math.max(im.naturalWidth, 2*z.querySelector(".zbody").clientWidth)+"px"; };
  fit();
  z.addEventListener("click", ev=>{ const b=ev.target.closest("button"); if(!b) return; if(b.dataset.zc) z.remove(); else if(b.dataset.z==="fit") fit(); else big(); });
  document.body.appendChild(z); z.querySelector("[data-zc]").focus();
}
document.addEventListener("click", e=>{ const img=e.target.closest(".qimg img"); if(img){ e.preventDefault(); openZoom(img.getAttribute("src")); } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ const z=$(".zoomer"); if(z){ z.remove(); e.stopPropagation(); } } }, true);

/* ---------------- test en curso: se guarda en cada cambio (iOS puede cerrar la app en segundo plano) ---------------- */
let curSaveT = null;
function saveCurSoon(){ clearTimeout(curSaveT); curSaveT = setTimeout(saveCur, 200); }
async function saveCur(){
  clearTimeout(curSaveT);
  const T = S.test;
  try{
    if(!T || T.ended) return;
    const snap = {v:1, id:T.id, cfg:T.cfg, items:T.items, cur:T.cur, reveal:T.reveal, elapsed:(T.hiddenAt||Date.now())-T.start, savedAt:Date.now()};
    if(S.set.lock && S.vault.key) await Store.set("cur", await Crypt.seal(snap, S.vault.key, S.vault.salt));
    else await Store.set("cur", snap);
  }catch(e){ console.warn("saveCur", e); }
}
async function loadCur(){
  try{
    let c = await Store.get("cur"); if(!c) return null;
    if(c.formato === "atc-cifrado"){ if(!S.vault.key) return null; c = await Crypt.open(c, S.vault.key); }
    if(!c.items || !c.items.length || !c.items.every(it=>S.byId.has(it.id))){ await Store.del("cur"); return null; }
    return c;
  }catch(e){ return null; }
}
async function offerResume(){
  if(S.test) return;
  const c = await loadCur(); if(!c) return;
  const ans = c.items.filter(x=>x.ans!=null).length;
  openDialog(`<h2>Test a medias</h2><p class="read" style="margin:0">Tienes un test de <b>${esc(MODS[c.cfg.mod]?.name||c.cfg.mod)}</b> sin terminar: ${ans}/${c.items.length} respondidas · ${fmtDur(c.elapsed)} de tiempo · guardado ${fmtDate(c.savedAt)}.</p>
    <div class="row"><button class="btn primary" id="rs-go" type="button">Continuar</button><button class="btn danger" id="rs-del" type="button">Descartar</button></div>`);
  $("#rs-go").onclick=()=>{ closeDialog(); const now=Date.now(); S.test={id:c.id, cfg:c.cfg, items:c.items, cur:Math.min(c.cur||0, c.items.length-1), start:now-c.elapsed, qStart:now, ended:false, reveal:c.reveal||{}}; document.body.classList.add("in-test"); go("test"); };
  $("#rs-del").onclick=async()=>{ closeDialog(); await Store.del("cur"); toast("Test descartado"); };
}
async function discardTest(){
  const T=S.test; if(!T) return; T.ended=true; clearInterval(timerH); S.test=null; await Store.del("cur");
  document.body.classList.remove("in-test"); toast("Test descartado (no cuenta en el historial)"); go("home");
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible" && Sync.on() && Date.now()-Sync.last > 5*60*1000) Sync.soon(1000); });
window.addEventListener("online", () => { if(Sync.on()) Sync.soon(1500); });
document.addEventListener("visibilitychange", () => { // el cronómetro se pausa mientras la app está en segundo plano
  const T = S.test; if(!T || T.ended) return;
  if(document.visibilityState === "hidden"){ if(!T.hiddenAt){ trackTime(); T.hiddenAt = Date.now(); } saveCur(); }
  else if(T.hiddenAt){ const away = Date.now() - T.hiddenAt; T.start += away; T.qStart = Date.now(); delete T.hiddenAt; }
});
window.addEventListener("pagehide", () => { const T=S.test; if(T && !T.ended){ if(!T.hiddenAt){ trackTime(); T.hiddenAt=Date.now(); } saveCur(); } });
function moveTo(i){ const T=S.test; if(i<0||i>=T.items.length) return; trackTime(); T.cur=i; vTest($(".view")); }
function askFinish(){
  const T=S.test; const bl=T.items.filter(x=>x.ans==null).length, fl=T.items.filter(x=>x.flag).length;
  openDialog(`<h2>Finalizar test</h2><p class="read" style="margin:0">${bl?`<span class="warn">${bl} sin responder</span> (cuentan como blanco, sin penalización). `:"Todas respondidas. "}${fl?`${fl} marcadas para revisar. `:""}¿Corregir ahora?</p>
    <div class="row"><button class="btn primary" id="fn-ok" type="button">Corregir</button><button class="btn ghost" data-close type="button">Seguir</button><button class="btn sm danger" id="fn-del" type="button" style="margin-left:auto">Descartar sin guardar</button></div>`);
  $("#fn-ok").onclick=()=>{ closeDialog(); finishTest("fin"); };
  $("#fn-del").onclick=async()=>{ closeDialog(); if(await confirmBox("Descartar test","El test no se corrige ni cuenta en el historial ni en el repaso.","Descartar",true)) discardTest(); };
}
function tickTimer(){
  clearInterval(timerH);
  const upd=()=>{ const T=S.test; const el=$("#timer"); if(!T||!el||T.hiddenAt) return; const el_ms=Date.now()-T.start;
    if(T.cfg.timer){ const left=T.cfg.timer*1000-el_ms; el.textContent=fmtDur(left); el.className="timer mono"+(left<60000?" low":"")+(left<=0?" out":""); if(left<=0){ finishTest("tiempo"); } }
    else el.textContent = fmtDur(el_ms); };
  upd(); timerH=setInterval(upd, 500);
}
document.addEventListener("keydown", e=>{
  if(!S.test || S.view!=="test" || !$("#overlay").hidden) return;
  if(e.target.matches("input,textarea,select")) return;
  const T=S.test, it=curItem(), q=S.byId.get(it.id);
  const k=e.key.toLowerCase();
  const pos = k.length===1 ? ("12345".indexOf(k)>=0 ? "12345".indexOf(k) : "abcde".indexOf(k)) : -1;
  if(pos>=0 && pos<it.perm.length && !(T.cfg.inmediata && T.reveal[T.cur])){ const oi=it.perm[pos]; it.ans = it.ans===oi?null:oi; vTest($(".view")); e.preventDefault(); }
  else if(k==="arrowright"){ moveTo(T.cur+1); e.preventDefault(); }
  else if(k==="arrowleft"){ moveTo(T.cur-1); e.preventDefault(); }
  else if(k==="m"){ it.flag=!it.flag; vTest($(".view")); }
});

function explBlock(q, ans, perm){
  const order = perm || q.opciones.map((_,i)=>i);
  const items = order.map((oi,pos)=>{ const c=oi===q.correcta, w=ans===oi && !c; const why = q.descartes && q.descartes[oi] && !c ? `<span class="why">${fmtRich(q.descartes[oi])}</span>` : "";
    return `<li class="${c?"c":w?"w":""}"><b class="k ${c?"ok":w?"ko":"dim"}">${LETTERS[pos]}</b><span>${renderOpt(q.opciones[oi])}${c?' <span class="ok mono" style="font-size:var(--fs-xs)">✓ CORRECTA</span>':""}${w?' <span class="ko mono" style="font-size:var(--fs-xs)">✗ TU RESPUESTA</span>':""}</span>${why}</li>`; }).join("");
  const solImg = q.img_sol && safeImg(q.img_sol);
  return `<ul class="ol">${items}</ul>${q.explicacion?`<div class="expl">${fmtRich(q.explicacion)}</div>`:`<div class="dim">Sin explicación en el banco.</div>`}
    ${solImg?`<div class="qimg sol"><img src="${solImg}" alt="Figura de la explicación"></div>`:""}
    ${(()=>{ const ck=q.clave_original||q.clave_academia; if(!ck) return ""; const ai="ABCDEF".indexOf(ck); if(ai<0||ai===q.correcta) return ""; const pos=order.indexOf(ai); return `<div class="dim" style="font-size:var(--fs-xs)">La clave del material original marcaba <b class="warn">${LETTERS[pos]}</b> (${esc(typeof q.opciones[ai]==="string"?q.opciones[ai]:"figura")}).</div>`; })()}
    ${q.revision==="dudosa"?`<div class="note-dudosa"><b>Pregunta marcada como dudosa.</b> ${fmtRich(q.nota_revision||"")}</div>`:""}
    <div class="dim" style="font-size:var(--fs-xs)">${q.origen==="archivo"?"De tus archivos":"Generada"}${q.fuente?" · "+esc(q.fuente):""}${q.nivel?" · "+esc(q.nivel):""}</div>`;
}

  const a = S.prog.attempts.find(x=>x.id===S.lastResultId) || S.prog.attempts[S.prog.attempts.length-1];

      <div><span class="label">Tiempo</span><div class="v">${fmtDur(a.dur)}</div></div>
      <div><span class="label">Penaliz.</span><div class="v">${pen?"−"+(pen===0.25?"1/4":pen<0.34&&pen>0.32?"1/3":fmtN(pen)):"0"}</div></div>
    </div></div>

  </div>
  <div class="panel"><div class="panel-h"><h3>Por tema</h3><span class="dim" style="font-size:var(--fs-xs)">peor arriba</span></div>
    <div class="bars">${tlist.map(([t,v])=>barRow(t, v.ok, v.n, `${v.ok}/${v.n}`)).join("")}</div></div>
  <div class="row"><button class="btn primary" id="r-again" type="button">Otro test igual</button>${sc.ko+sc.bl?`<button class="btn amber" id="r-fails" type="button">Repetir mis fallos (${sc.ko+sc.bl})</button>`:""}<button class="btn ghost" data-go2="home" type="button">Inicio</button></div>
  <div class="panel"><div class="panel-h"><h3>Corrección</h3>
    <div class="seg" id="rf">${[["todas","Todas · "+sc.n],["ko","Fallos · "+sc.ko],["bl","Blanco · "+sc.bl],["flag","Marcadas · "+a.items.filter(i=>i.flag).length]].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${filt===v}">${l}</button>`).join("")}</div></div>
    <div class="review">${a.items.map((it,i)=>{ const q=hydrate(it.id, it.snap); const st = it.ans==null?"bl":it.ans===q.correcta?"ok":"ko";
      if(filt==="ko"&&st!=="ko"||filt==="bl"&&st!=="bl"||filt==="flag"&&!it.flag) return "";
      const userFlag = S.prog.flags[it.id]?.dudosa;
      return `<div class="rv st-${st}"><div class="row" style="justify-content:space-between"><span class="label tab-num">${String(i+1).padStart(2,"0")} · ${esc(q.tema||"")} ${it.flag?'<span class="warn">· marcada</span>':""}</span><span class="chip ${st==="ok"?"ok":st==="ko"?"ko":""}">${st==="ok"?"Acierto":st==="ko"?"Fallo":"En blanco"}</span></div>
        ${q.contexto?`<details><summary class="label" style="cursor:pointer">Ver texto</summary><div class="qctx">${fmtRich(q.contexto)}</div></details>`:""}

        <div class="stem">${fmtRich(q.enunciado||"")}</div>
        ${explBlock(q, it.ans, it.perm)}

      </div>`; }).join("")}</div></div>`;
  $("#rf",el).onclick=e=>{ const b=e.target.closest("button[data-v]"); if(!b) return; vResult._f=b.dataset.v; vResult(el); };
  $("#r-again",el).onclick=()=>startTest({...a.cfg, modo:"normal"});
  const rf=$("#r-fails",el); if(rf) rf.onclick=()=>{ const ids=a.items.filter(it=>it.ans!==it.snap.correcta).map(it=>it.id).filter(id=>S.byId.has(id)); startCustom(a.cfg, ids); };
  $$("[data-flagq]",el).forEach(b=>b.onclick=async()=>{ const id=b.dataset.flagq; const f=S.prog.flags[id]||{}; f.dudosa=!f.dudosa; f.t=Date.now(); S.prog.flags[id]=f; await persist(); Sync.soon(8000); toast(f.dudosa?"Marcada como dudosa (se excluye de los tests salvo que la incluyas)":"Marca quitada"); vResult(el); });
  wireCommon(el);
}
function startCustom(cfg, ids){
  const qs = shuffle(ids.map(id=>S.byId.get(id)).filter(Boolean)); if(!qs.length){ toast("No hay preguntas", true); return; }
  const items = qs.map(q=>{ let perm=[...q.opciones.keys()]; if(cfg.shuffle && !refersToPositions(q)) perm=shuffle(perm); return {id:q.id, perm, ans:null, flag:false, t:0}; });
  S.test = {id:uid("TST"), cfg:{...cfg, modo:"fallos", n:items.length, timer:0}, items, cur:0, start:Date.now(), qStart:Date.now(), ended:false, reveal:{}};
  document.body.classList.add("in-test"); go("test");
}
function barRow(name, ok, n, right, attrs=""){ const p=n?ok/n:0; return `<div class="bar ${attrs?"clickable":""}" ${attrs}><span class="nm" title="${esc(name)}">${esc(name)}</span><span class="track"><span class="fill ${p<.6?"low":p<.8?"mid":""}" style="width:${(p*100).toFixed(1)}%"></span></span><span class="pc">${pct(ok,n)}% · ${right}</span></div>`; }

  </div>

    <div class="bars">${boxes.map((n,i)=>`<div class="bar"><span class="nm">Caja ${i+1} · ${i===0?"hoy":SRS_INT[i+1]+" d"}</span><span class="track"><span class="fill ${i<1?"low":i<3?"mid":""}" style="width:${Math.min(100, n*4)}%"></span></span><span class="pc">${n} preg.</span></div>`).join("")}</div>

function temaStats(mod){
  const map={};
  for(const q of allQ().filter(q=>q.modulo===mod)){ const s=S.prog.q[q.id]; const t=map[q.tema]=map[q.tema]||{tema:q.tema, total:0, n:0, ok:0, seen:0}; t.total++; if(s){ t.seen++; t.n+=s.n; t.ok+=s.ok; } }
  return Object.values(map).sort((a,b)=>(a.n?a.ok/a.n:2)-(b.n?b.ok/b.n:2));

function sparkline(vals){
  if(vals.length<2) return `<div class="dim" style="font-size:var(--fs-xs)">Se necesita más de un test para ver la tendencia.</div>`;
  const W=300,H=46,p=4; vals=vals.map(v=>Math.max(0,Math.min(10,v))); const xs=i=>p+i*(W-2*p)/(vals.length-1), ys=v=>H-p-(v/10)*(H-2*p);
  const d=vals.map((v,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(" ");
  const last=vals[vals.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Tendencia de notas">
    <line x1="${p}" x2="${W-p}" y1="${ys(5)}" y2="${ys(5)}" stroke="var(--line-2)" stroke-dasharray="3 3"></line>
    <path d="${d} L${xs(vals.length-1).toFixed(1)},${H-p} L${p},${H-p} Z" fill="rgba(82,214,143,.10)"></path>
    <path d="${d}" fill="none" stroke="var(--green)" stroke-width="1.6" vector-effect="non-scaling-stroke"></path>
    <circle cx="${xs(vals.length-1).toFixed(1)}" cy="${ys(last).toFixed(1)}" r="3" fill="var(--green)"></circle></svg>`;
}

function askPass(title, confirm2=false){

    openDialog(`<h2>${esc(title)}</h2><input type="password" class="input" id="pw1" autocomplete="new-password" placeholder="Contraseña">${confirm2?`<input type="password" class="input" id="pw2" autocomplete="new-password" placeholder="Repite la contraseña">`:""}<div id="pw-err" class="ko" style="font-size:var(--fs-s)"></div><div class="row"><button class="btn primary" id="pw-ok" type="button">Aceptar</button><button class="btn ghost" id="pw-no" type="button">Cancelar</button></div>`);
    const ok=()=>{ const a=$("#pw1").value; if(a.length<6){ $("#pw-err").textContent="Mínimo 6 caracteres."; return; } if(confirm2 && a!==$("#pw2").value){ $("#pw-err").textContent="No coinciden."; return; } closeDialog(); res(a); };
    $("#pw-ok").onclick=ok; $("#pw-no").onclick=()=>{ closeDialog(); res(null); };
    $$("#overlay input").forEach(i=>i.onkeydown=e=>{ if(e.key==="Enter") ok(); });
  });
}

    <div class="kv"><div><span class="label">Motor</span><div class="v" style="font-size:1rem">${Store.mode==="idb"?"IndexedDB":Store.mode==="ls"?"localStorage":"Memoria (¡no persiste!)"}</div></div><div><span class="label">Tus datos</span><div class="v" style="font-size:1rem">${fmtN(sz/1024,0)} KB</div></div><div><span class="label">Cuota aprox.</span><div class="v" style="font-size:1rem">${est&&est.quota?fmtN(est.quota/1048576,0)+" MB":"—"}</div></div><div><span class="label">Persistente</span><div class="v" style="font-size:1rem">${persisted?"Sí":"No"}</div></div></div>
    ${persisted?"":`<button class="btn sm" id="st-persist" type="button">Pedir almacenamiento persistente</button>`}
    <p class="read muted" style="margin:0;font-size:var(--fs-s)">Los datos viven solo en este navegador y este dispositivo. Se pierden si borras los datos del sitio, usas modo incógnito o (en algunos navegadores) si mueves el archivo de la app a otra carpeta. Exporta una copia cada semana.</p>
    ${BUILD.ios?`<p class="read warn" style="margin:0;font-size:var(--fs-s)">iPhone: la app instalada en la pantalla de inicio y Safari tienen datos separados. Si eliminas el icono de la pantalla de inicio, se borran los datos de la app: exporta antes una copia.</p>`:""}
    <button class="btn sm danger" id="st-wipe" type="button">Borrar todos mis datos</button>
  </div>
  </div>
  <div class="row"><p class="dim" style="font-size:var(--fs-xs);margin:0">APP ATC v${APP_VERSION}${BUILD.id&&!BUILD.id.startsWith("/*")?" · build "+esc(BUILD.id):""} · ${BUILD.standalone?"app instalada":location.protocol==="file:"?"archivo local":"en navegador"} · tus datos no salen de este dispositivo.</p>${SWREG?`<button class="btn sm ghost" id="st-upd" type="button">Buscar actualización</button>`:""}</div>`;
  $$("[data-set]",el).forEach(g=>g.onclick=async e=>{ const b=e.target.closest("button[data-v]"); if(!b) return; S.set[g.dataset.set]=Number(b.dataset.v); await saveSettings(); draftCfg=null; vSettings(el); });
  $("#st-shuf",el).onchange=async e=>{ S.set.shuffle=e.target.checked; await saveSettings(); draftCfg=null; };
  $("#st-dud",el).onchange=async e=>{ S.set.dudosas=e.target.checked; await saveSettings(); draftCfg=null; };
  const on=$("#pw-on",el); if(on) on.onclick=async()=>{ const p=await askPass("Nueva contraseña", true); if(!p) return; S.vault.salt=Crypt.newSalt(); S.vault.key=await Crypt.key(p, S.vault.salt); S.set.lock=true; await saveSettings(); await persist({bank:true}); await Aud.reseal(); toast("Contraseña activada: datos cifrados"); vSettings(el); };
  const ch=$("#pw-change",el); if(ch) ch.onclick=async()=>{ const p=await askPass("Nueva contraseña", true); if(!p) return; S.vault.salt=Crypt.newSalt(); S.vault.key=await Crypt.key(p, S.vault.salt); await persist({bank:true}); toast("Contraseña cambiada"); };
  const off=$("#pw-off",el); if(off) off.onclick=async()=>{ if(!await confirmBox("Desactivar contraseña","Tus datos volverán a guardarse sin cifrar en este navegador.","Desactivar",true)) return; const oldK=S.vault.key; S.set.lock=false; S.vault={key:null,salt:null}; await Aud.reseal(oldK); await saveSettings(); for(const k of VAULT_KEYS) await Store.del(k); await persist({bank:true}); toast("Contraseña desactivada"); vSettings(el); };
  const lk=$("#pw-lock",el); if(lk) lk.onclick=lockNow;
  const stamp=()=>new Date().toISOString().slice(0,10);
  const full=()=>({formato:"atc-copia", version:1, fecha:Date.now(), imported:S.imported, prog:S.prog, settings:{...S.set, lock:false}});
  $("#bk-ex",el).onclick=()=>download(`copia_app_atc_${stamp()}.json`, JSON.stringify(full()));
  const exc=$("#bk-exc",el); if(exc) exc.onclick=async()=>{ const p=await askPass("Contraseña para esta copia", true); if(!p) return; const salt=Crypt.newSalt(); const k=await Crypt.key(p,salt); const box=await Crypt.seal(full(), k, salt); download(`copia_app_atc_cifrada_${stamp()}.json`, JSON.stringify(box)); };
  const readBk = () => new Promise((res)=>{ const f=$("#bk-file",el).files[0]; if(!f){ toast("Elige primero el archivo de copia", true); return res(null); } const rd=new FileReader(); rd.onload=async()=>{ try{ let d=JSON.parse(rd.result); if(d.formato==="atc-cifrado"){ const p=await askPass("Contraseña de la copia"); if(!p) return res(null); const k=await Crypt.key(p, Crypt.unb64(d.salt)); d=await Crypt.open(d,k); } if(d.formato!=="atc-copia") throw new Error("No es una copia de APP ATC"); res(d); }catch(e){ toast("No se pudo leer la copia: "+(e.message||"contraseña incorrecta"), true); res(null); } }; rd.readAsText(f); });
  $("#bk-merge",el).onclick=async()=>{ const d=await readBk(); if(!d) return; const r=await importQs(d.imported||[]); const na0=S.prog.attempts.length; mergeProg(d.prog||defaultsProg()); const na=S.prog.attempts.length-na0; await persist({bank:true}); Sync.soon(); $("#bk-rep",el).textContent=`Fusionado: ${r.nuevas} preguntas nuevas, ${r.act} actualizadas, ${na} tests añadidos.`; toast("Copia fusionada"); };
  $("#bk-repl",el).onclick=async()=>{ const d=await readBk(); if(!d) return; if(!await confirmBox("Reemplazar todo","Se sustituirán tu banco importado y tu progreso de este navegador por los de la copia.","Reemplazar",true)) return; S.imported=d.imported||[]; S.prog=d.prog||defaultsProg(); rebuildIndex(); await persist({bank:true}); Sync.soon(); toast("Copia restaurada"); vSettings(el); };
  const syOn=$("#sy-on",el); if(syOn) syOn.onclick=async()=>{
    let repo=$("#sy-repo",el).value.trim().replace(/^https?:\/\/github\.com\//i,"").replace(/\.git$/,"").replace(/\/+$/,"");
    const tok=$("#sy-tok",el).value.trim(), pass=$("#sy-pass",el).value;
    const st=$("#sy-st",el);
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ st.innerHTML=`<span class="ko">Escribe el repositorio como usuario/nombre (por ejemplo, javier/atc-datos).</span>`; return; }
    if(tok.length<20){ st.innerHTML=`<span class="ko">Pega el token completo (empieza por github_pat_).</span>`; return; }
    if(pass.length<6){ st.innerHTML=`<span class="ko">La contraseña de sincronización debe tener al menos 6 caracteres.</span>`; return; }
    syOn.disabled=true; st.innerHTML=`<span class="sel">Conectando y sincronizando… (la primera vez, con todo el banco, puede tardar un poco)</span>`;
    const r=await Sync.activate(repo, tok, pass);
    if(r.ok){ toast("Sincronización activada"); vSettings(el); } else { syOn.disabled=false; st.innerHTML=`<span class="ko">No se pudo activar: ${esc(r.msg)}</span>`; }
  };
  const syNow=$("#sy-now",el); if(syNow) syNow.onclick=async()=>{ syNow.disabled=true; await Sync.run(true); syNow.disabled=false; const s=$("#sy-st",el); if(s) s.innerHTML=Sync.statusHTML(); };
  const syOff=$("#sy-off",el); if(syOff) syOff.onclick=async()=>{ if(!await confirmBox("Desactivar sincronización","Este dispositivo dejará de sincronizarse y olvidará el token. Tus datos locales y los del repositorio no se borran.","Desactivar",true)) return; await Sync.disable(); toast("Sincronización desactivada"); vSettings(el); };
  const su=$("#st-upd",el); if(su) su.onclick=async()=>{ try{ await SWREG.update(); toast(SWREG.waiting||SWREG.installing?"Descargando versión nueva…":"Ya tienes la última versión"); }catch(e){ toast("Sin conexión: inténtalo luego", true); } };
  const sp=$("#st-persist",el); if(sp) sp.onclick=async()=>{ try{ const ok=await navigator.storage.persist(); toast(ok?"Almacenamiento persistente concedido":"El navegador no lo ha concedido (es normal en algunos)"); }catch(e){ toast("No disponible en este navegador", true); } vSettings(el); };
  $("#st-wipe",el).onclick=async()=>{ if(!await confirmBox("Borrar todo","Se borrarán el banco importado, el progreso y los ajustes de este navegador. Las preguntas integradas se mantienen. No se puede deshacer.","Borrar todo",true)) return; for(const id of Object.keys(((S.prog||{}).speak||{}).sessions||{})) await Aud.del(id); await Store.del("imported"); await Store.del("prog"); for(const k of VAULT_KEYS) await Store.del(k); await Store.del("settings"); S.imported=[]; S.prog=defaultsProg(); S.set={penal:1/3, shuffle:true, dudosas:false, readScale:1, lock:false}; S.vault={key:null,salt:null}; for(const k of ["sync_sec","vault_sync","sync_state"]) await Store.del(k); Sync.forget(); rebuildIndex(); applySettings(); toast("Datos borrados"); vSettings(el); };
}

/* ---------------- bloqueo ---------------- */
function lockNow(){ Sync.forget(); S.vault.key=null; S.imported=[]; S.prog=defaultsProg(); rebuildIndex(); showLock(); }
function showLock(){
  const L=$("#lock"); L.hidden=false;
  L.innerHTML=`<div class="dialog"><span class="label warn">Acceso restringido</span><h2>APP ATC bloqueada</h2><p class="read muted" style="margin:0">Introduce tu contraseña para descifrar el banco y el progreso.</p><input type="password" class="input" id="lk-pw" autocomplete="current-password" placeholder="Contraseña"><div id="lk-err" class="ko" style="font-size:var(--fs-s)"></div><div class="row"><button class="btn primary" id="lk-ok" type="button">Desbloquear</button><button class="btn ghost" id="lk-forgot" type="button">He olvidado la contraseña</button></div></div>`;
  const tryOpen=async()=>{ const p=$("#lk-pw").value; if(!await hasVault()){ L.hidden=true; return; } try{ const d=await openVault(p); if(!d) throw new Error("vacío"); S.vault={key:d.k, salt:d.salt}; S.imported=d.imported; S.prog=d.prog; rebuildIndex(); applySettings(); if(d.legacy) await persist({bank:true}); L.hidden=true; L.innerHTML=""; go("home"); offerResume(); await Sync.load(); Sync.soon(800); }catch(e){ $("#lk-err").textContent="Contraseña incorrecta."; } };
  $("#lk-ok").onclick=tryOpen; $("#lk-pw").onkeydown=e=>{ if(e.key==="Enter") tryOpen(); }; $("#lk-pw").focus();
  $("#lk-forgot").onclick=async()=>{ $("#lk-err").innerHTML=`Sin la contraseña los datos cifrados no se pueden recuperar. <button class="btn sm danger" id="lk-wipe" type="button">Borrarlos y empezar de cero</button>`; $("#lk-wipe").onclick=async()=>{ for(const k of VAULT_KEYS) await Store.del(k); await Store.del("vault_sync"); S.set.lock=false; await saveSettings(); L.hidden=true; go("home"); }; };
}

/* ---------------- arranque ---------------- */
function utcClock(){ const d=new Date(); $("#st-utc").textContent = String(d.getUTCHours()).padStart(2,"0")+String(d.getUTCMinutes()).padStart(2,"0")+"Z"; }
async function boot(){
  try{ const raw=$("#builtin-bank").textContent.trim(); const d = raw && !raw.startsWith("/*") ? JSON.parse(raw) : {preguntas:[]}; S.builtin = (d.preguntas||[]).filter(q=>q && q.id); }catch(e){ console.error(e); S.builtin=[]; }
  const mode = await Store.init();
  $("#st-store").textContent = mode==="mem" ? "SIN GUARDADO" : "LOCAL";
  const st = await Store.get("settings"); if(st) S.set = {...S.set, ...st};
  applySettings();
  $$(".tab").forEach(t=>t.onclick=()=>{ if(t.dataset.go==="new") draftCfg=draftCfg||null; go(t.dataset.go); });
  $("#btn-lock").onclick=lockNow;
  utcClock(); setInterval(utcClock, 15000);
  if(S.set.lock){ rebuildIndex(); go("home"); if(await hasVault()) showLock(); else { S.set.lock=false; await saveSettings(); } return; }
  S.imported = (await Store.get("imported")) || [];
  S.prog = (await Store.get("prog")) || defaultsProg();
  rebuildIndex(); go(location.hash === "#speaking" ? "speak" : "home");
  if(mode==="mem") toast("Este navegador no permite guardar datos: exporta una copia antes de cerrar", true);
  offerResume();
  await Sync.load(); Sync.soon(1200);
}
/* ---------------- app instalable (PWA): funciona sin conexión y avisa de versiones nuevas ---------------- */
let SWREG = null;
function initPWA(){
  if(BUILD.standalone && navigator.storage && navigator.storage.persist){ navigator.storage.persisted().then(p=>{ if(!p) return navigator.storage.persist(); }).catch(()=>{}); }
  if(!BUILD.pwa || !("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
  let wantReload = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(wantReload){ wantReload = false; location.reload(); } });
  navigator.serviceWorker.register("./sw.js").then(reg => {
    SWREG = reg;
    const offer = w => { const show = () => { if(S.test && !S.test.ended){ setTimeout(show, 30000); return; } showUpdateBar(() => { wantReload = true; w.postMessage("skipWaiting"); setTimeout(()=>{ if(wantReload) location.reload(); }, 4000); }); }; show(); };
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => { const nw = reg.installing; if(!nw) return; nw.addEventListener("statechange", () => { if(nw.state === "installed" && navigator.serviceWorker.controller) offer(nw); }); });
    document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") reg.update().catch(()=>{}); });
  }).catch(e => console.warn("SW", e));
}
function showUpdateBar(apply){
  if($("#updbar")) return;
  const b = document.createElement("div"); b.id = "updbar"; b.className = "banner updbar"; b.setAttribute("role","status");
  b.innerHTML = `<span class="grow">Hay una versión nueva de la app. Tus datos no se tocan.</span><button class="btn sm primary" type="button" id="upd-go">Actualizar</button><button class="btn sm ghost" type="button" id="upd-no">Luego</button>`;
  document.body.appendChild(b);
  $("#upd-go").onclick = () => { b.remove(); apply(); };
  $("#upd-no").onclick = () => b.remove();
}
window.addEventListener("hashchange", ()=>{ if(location.hash === "#speaking" && !(S.test && !S.test.ended)) go("speak"); });
window.addEventListener("beforeunload", e=>{ if(SPKS && SPKS.phase==="rec"){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("beforeunload", e=>{ if(S.test && !S.test.ended){ saveCur(); e.preventDefault(); e.returnValue=""; } });
boot().then(initPWA, initPWA);
</script>
</body>
